<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Reper</title>
<style>
:root{
  --desk:#14161a; --desk-hi:#1c1f25;
  --paper:#fcfbf7; --ink:#191b1f; --soft:#6f7481;
  --hair:rgba(255,255,255,.09); --margin:#c8b28a; --accent:#2c3e63;
  --lift:0 1px 0 rgba(255,255,255,.55) inset, 0 20px 44px rgba(0,0,0,.46), 0 3px 10px rgba(0,0,0,.3);
  --pill:rgba(252,251,247,.93);
  --ease:cubic-bezier(.2,.9,.25,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{background:radial-gradient(120% 80% at 50% -10%,var(--desk-hi),var(--desk) 60%);
  color:#e8e7e3;font:400 15px/1.45 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex;flex-direction:column;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
#top svg,#dock svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

#top{height:44px;flex:0 0 auto;display:flex;align-items:center;gap:2px;padding:0 10px;border-bottom:1px solid var(--hair)}
#top button{opacity:.45;padding:9px;transition:opacity .2s}
#top button:active,#top button:hover{opacity:1}
#top button[disabled]{opacity:.14}
#tPlayer.on{opacity:1;color:#d6b36a}
#count{margin:0 auto;font:400 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.28em;opacity:.4}
#dot{width:5px;height:5px;border-radius:9px;background:#7fbf8f;opacity:0;transition:opacity .4s;margin-left:4px}
#dot.on{opacity:.75}

#viewTabs{height:36px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:3px;padding:3px 8px;
  border-bottom:1px solid var(--hair);background:#14161af2;overflow-x:auto;scrollbar-width:none}
#viewTabs::-webkit-scrollbar{display:none}
#viewTabs button{flex:0 1 92px;min-width:64px;height:28px;padding:0 9px;border-radius:8px;color:#ffffff78;
  font:650 10px/1 ui-sans-serif,sans-serif;letter-spacing:.02em;white-space:nowrap}
#viewTabs button.on{background:#ffffff11;color:#e5c16f;box-shadow:inset 0 0 0 1px #d6b36a35}

#scroller{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;
  scroll-behavior:smooth;touch-action:pan-y;overscroll-behavior-x:none}
#scroller::-webkit-scrollbar{display:none}
.slot{flex:0 0 100%;scroll-snap-align:center;display:grid;place-items:start center;padding:14px 26px 0}
.paper{position:relative;background:var(--paper);border-radius:5px 5px 0 0;box-shadow:var(--lift);
  width:min(660px,100%);height:100%;overflow:hidden;--pat:rgba(0,0,0,.085);--pat2:rgba(0,0,0,.22)}
.sheet{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior-y:contain;touch-action:pan-y}
body.zoomed .sheet{overflow-x:auto;touch-action:none}
body.zoomed .zoomer{transform-origin:top left}
.sheet::-webkit-scrollbar{width:0}
.doc{position:relative;width:100%}
.doc::before{content:"";position:absolute;top:0;bottom:0;left:34px;width:1px;background:var(--margin);opacity:.5}
.doc[data-s="ruled"]{background-image:repeating-linear-gradient(to bottom,transparent 0 28px,var(--pat) 28px 29px);background-position:0 33px}
.doc[data-s="grid"]{background-image:repeating-linear-gradient(to bottom,transparent 0 24px,var(--pat) 24px 25px),repeating-linear-gradient(to right,transparent 0 24px,var(--pat) 24px 25px);background-position:0 33px}
.doc[data-s="dots"]{background-image:radial-gradient(var(--pat2) 1.3px,transparent 1.4px);background-size:23px 23px;background-position:12px 33px}
.paper[data-s="plain"] .doc::before,.paper[data-s="dark"] .doc::before{opacity:.22}
.paper[data-s="dark"]{--paper:#15171b;--ink:#e9e8e4;--margin:#5b5f6a;--pat:rgba(255,255,255,.1);--pat2:rgba(255,255,255,.22);
  box-shadow:0 0 0 1px rgba(255,255,255,.07),0 20px 44px rgba(0,0,0,.5)}
.paper[data-s="dark"] .doc::after{opacity:.1}
.paper[data-s="dark"] .ink{mix-blend-mode:normal}
.doc::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence baseFrequency='.9' numOctaves='3'/></filter><rect width='120' height='120' filter='url(%23n)' opacity='.05'/></svg>")}
.editor{position:relative;z-index:1;outline:none;color:var(--ink);padding:34px 26px 40px 52px;
  font-family:"Iowan Old Style","Palatino Linotype",Palatino,Charter,Georgia,serif;
  font-size:17px;line-height:1.7;user-select:text;-webkit-user-select:text}
.editor:empty::before{content:attr(data-ph);color:var(--ink);opacity:.3;font-style:italic}
.editor h2{font-size:1.35em;font-weight:600;letter-spacing:-.01em;margin:.8em 0 .3em}
.editor blockquote{margin:.7em 0;padding-left:.9em;border-left:2px solid var(--margin);color:var(--ink);opacity:.72;font-style:italic}
.editor ul,.editor ol{padding-left:1.35em;margin:.5em 0}
.editor img{max-width:100%;height:auto;border-radius:3px;margin:.5em 0;display:block}
.ink{position:absolute;top:0;left:0;width:100%;z-index:2;mix-blend-mode:multiply}
body[data-mode="text"] .ink{pointer-events:none}
body[data-mode="ink"] .ink{touch-action:none}
body[data-mode="ink"] .editor{pointer-events:none;user-select:none}

/* Por encima del reproductor (45). Estaba por debajo, y como la barra se
   puede arrastrar, la que acababa debajo del reproductor no recibía los
   toques: se pulsaba el botón de formato y no pasaba nada. */
#dockwrap{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:46;touch-action:none}
#dockwrap.free{transform:none}
#dock{display:flex;align-items:center;gap:3px;padding:5px;height:46px;background:var(--pill);color:var(--ink);
  border-radius:999px;box-shadow:0 12px 32px rgba(0,0,0,.42);backdrop-filter:blur(14px)}
#dock button{width:36px;height:36px;border-radius:999px;display:grid;place-items:center;transition:background .18s}
#dock button:active{background:#0000000f}
#dock button.on{background:var(--ink);color:var(--paper)}
#grip{width:16px!important;opacity:.28;cursor:grab;touch-action:none;letter-spacing:-2px;font-size:13px}
#grip:active{opacity:.7;cursor:grabbing}
#inkbar{display:none;align-items:center;gap:3px}
body[data-mode="ink"] #inkbar{display:flex}
body[data-mode="ink"] #textbar{display:none}
#textbar{display:flex;align-items:center;gap:3px}
.swatch{width:15px;height:15px;border-radius:999px;box-shadow:0 0 0 1px #0002}
.div{width:1px;height:20px;background:#0000001a;margin:0 3px}

#pop{position:absolute;bottom:calc(100% + 9px);left:50%;z-index:2;
  transform:translateX(-50%) translateY(8px) scale(.94);transform-origin:bottom center;
  opacity:0;pointer-events:none;transition:transform .24s var(--ease),opacity .18s;
  background:var(--pill);color:var(--ink);border-radius:18px;padding:9px 10px;
  box-shadow:0 14px 34px rgba(0,0,0,.42);backdrop-filter:blur(14px);
  display:flex;flex-direction:column;gap:6px}
#pop.on{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0) scale(1)}
#dockwrap.below #pop{bottom:auto;top:calc(100% + 9px);transform-origin:top center}
.prow{display:flex;align-items:center;justify-content:center;gap:4px}
.prow+.prow{border-top:1px solid #0000000f;padding-top:7px}
.prow button{width:34px;height:34px;border-radius:999px;display:grid;place-items:center}
.prow button.on{background:#00000010}
.prow button.on .swatch{box-shadow:0 0 0 1.5px var(--pill),0 0 0 3px var(--ink)}
.wdot{background:currentColor;border-radius:999px;opacity:.85}

#fmt{position:fixed;z-index:50;display:none;flex-direction:column;gap:4px;padding:5px;background:var(--ink);
  color:#f4f3ef;border-radius:12px;box-shadow:0 10px 26px rgba(0,0,0,.5);max-width:calc(100vw - 16px)}
#fmt.on{display:flex}
.frow{display:flex;align-items:center;gap:2px}
.frow button{min-width:32px;height:30px;padding:0 6px;border-radius:7px;display:grid;place-items:center;font-size:14px;white-space:nowrap}
.frow button:active,.frow button.on{background:#ffffff20}
#fsub{display:none;border-top:1px solid #ffffff1f;padding-top:4px;flex-wrap:wrap;justify-content:center}
#fsub.on{display:flex}
#fmt .b{font-weight:700}#fmt .i{font-style:italic;font-family:Georgia,serif}
#fmt .u{text-decoration:underline}#fmt .st{text-decoration:line-through}
.tsw{width:15px;height:15px;border-radius:999px;box-shadow:0 0 0 1px #ffffff44}

#idx{position:fixed;inset:0;z-index:60;display:none;background:rgba(10,11,13,.55);backdrop-filter:blur(3px)}
#idx.open{display:block}
#panel{position:absolute;left:0;top:0;bottom:0;width:min(360px,88vw);background:var(--paper);color:var(--ink);
  display:flex;flex-direction:column;box-shadow:0 0 60px rgba(0,0,0,.5)}
#panel h2{margin:0;padding:20px 18px 12px;font:500 10px/1 ui-monospace,monospace;letter-spacing:.3em;
  text-transform:uppercase;color:var(--soft)}
#list{flex:1;overflow:auto;padding:0 10px 10px}
.row{display:flex;align-items:center;gap:10px;padding:12px 8px;background:var(--paper);border-radius:9px;border-bottom:1px solid #0000000d}
.row.dragging{box-shadow:0 12px 26px rgba(0,0,0,.22);border-bottom-color:transparent}
.row .n{font:400 11px/1 ui-monospace,monospace;color:var(--accent);width:20px;opacity:.8}
.row .s{flex:1;font-family:"Iowan Old Style",Georgia,serif;font-size:14px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.row .s.empty{opacity:.3;font-style:italic}
.row .grip{padding:6px;color:var(--soft);opacity:.5;touch-action:none;font-size:14px}
.row .x{padding:6px;color:var(--soft);opacity:.5;font-size:15px}
.prow.chips{flex-wrap:wrap;max-width:230px}
.prow.chips button{width:auto;padding:0 11px;height:32px;border-radius:999px;font-size:12px;
  background:#00000009;box-shadow:inset 0 0 0 1px #0000000f}
.prow.chips button.on{background:var(--ink);color:var(--paper);box-shadow:none}
#panel footer{display:flex;flex-wrap:wrap;gap:8px;padding:12px;border-top:1px solid #0000000d}
#panel footer button{flex:1;padding:11px;border-radius:10px;background:#0000000a;font-size:12.5px}
#toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:#000d;color:#fff;padding:9px 16px;
  border-radius:999px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:80}
#toast.on{opacity:1}
.linkchip{position:absolute;top:9px;right:11px;z-index:4;display:none;align-items:center;gap:5px;
  padding:5px 10px;border-radius:999px;font-size:11.5px;letter-spacing:.02em;
  background:var(--ink);color:var(--paper);opacity:.82;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.linkchip.on{display:flex}
.linkchip:active{opacity:1}
.row .lk{padding:6px;color:var(--soft);opacity:.55;font-size:14px}
.row .trackact{flex:0 0 30px;width:30px;height:30px;padding:0;border-radius:999px;background:var(--accent);color:#fff;
  display:grid;place-items:center;font:700 16px/1 ui-sans-serif,sans-serif;white-space:nowrap}
.row .trackact.ready{background:#e7f1e9;color:#267044}
.row .trackact.busy{background:#eee7d5;color:#755d25;font-size:8px}
.lkin{flex:1;min-width:0;border:0;background:#00000010;padding:9px 10px;border-radius:8px;
  font:400 12.5px ui-monospace,monospace;color:var(--ink)}
.editor a,.tbox a{color:var(--accent);text-decoration:none;border-bottom:1px solid currentColor;font-size:.9em}
.paper[data-s="dark"] .editor a{color:#8fb6ff}
.zoomer{transform-origin:top center;width:100%}
.tbox{position:absolute;z-index:1;min-height:1.4em;outline:none;padding:2px 5px;border-radius:3px;
  color:var(--ink);font-family:"Iowan Old Style","Palatino Linotype",Palatino,Charter,Georgia,serif;
  font-size:17px;line-height:1.6;white-space:pre-wrap;word-break:break-word;
  user-select:text;-webkit-user-select:text}
.tbox:empty::before{content:attr(data-ph);color:var(--ink);opacity:.28;font-style:italic}
.tbox.sel{box-shadow:0 0 0 1px var(--margin)}
.tbox .bh,.tbox .br{position:absolute;display:none;background:var(--accent);border-radius:999px;touch-action:none}
.tbox .bh{top:-10px;left:-10px;width:20px;height:20px;cursor:move}
.tbox .br{bottom:-8px;right:-8px;width:16px;height:16px;border-radius:4px;cursor:ew-resize}
.tbox.sel .bh,.tbox.sel .br{display:block}
body[data-lock="1"] .editor,body[data-lock="1"] .tbox,body[data-lock="1"] .ink,body[data-lock="1"] .scorebox,
body[data-lock="1"] .lyrics-pane,body[data-lock="1"] .chords-pane{pointer-events:none!important}
body[data-lock="1"] .tbox.sel{box-shadow:none}
body[data-lock="1"] #dockwrap,body[data-lock="1"] #fmt,body[data-lock="1"] #quickAdd,
body[data-lock="1"] .chord-tools,body[data-lock="1"] .chord-help,body[data-lock="1"] .scorechrome,
body[data-lock="1"] .scoreresize,body[data-lock="1"] .score-empty,body[data-lock="1"] .record-toolbar,
body[data-lock="1"] .record-delete,body[data-lock="1"] #bUndo,body[data-lock="1"] #bRedo,
body[data-lock="1"] #addPage,body[data-lock="1"] #voiceRecord{display:none!important}
.scorebox{position:absolute;z-index:3;min-width:110px;background:#fff;border-radius:5px;
  box-shadow:0 2px 10px #0002;touch-action:none;user-select:none;-webkit-user-select:none}
.scorebox.sel{box-shadow:0 0 0 1.5px var(--accent),0 5px 16px #0003}
.scorepreview{width:100%;overflow-x:auto;overflow-y:hidden;border-radius:5px 5px 0 0;cursor:pointer}
.scorepreview .sheet{position:relative;inset:auto;width:100%!important;height:auto;overflow:hidden;background:#fff;box-shadow:none;border-radius:5px}
.scorepreview .sheet-svg{display:block;width:100%;height:auto}
.scorepreview .sheet-head{display:none}
.scorepreview .scoreerror{padding:24px;color:#733;font:12px ui-sans-serif,sans-serif;text-align:center}
.scorechrome{position:relative;display:flex;justify-content:flex-end;gap:2px;height:24px;padding:1px 3px;border-radius:0 0 5px 5px;
  background:#15171bf2;color:#f3f1eb;opacity:.72;transition:opacity .16s}
.scorebox.sel .scorechrome,.scorebox:active .scorechrome{opacity:1}
.scorechrome button{width:23px;height:22px;display:grid;place-items:center;border-radius:5px;font-size:11px}
.scorechrome button:active{background:#ffffff20}
.scoregrip{touch-action:none;cursor:grab;color:#d6b36a}
.scoredelete{color:#ffaaaa}
.scoreresize{position:absolute;right:-7px;bottom:-7px;width:18px;height:18px;border-radius:5px;background:var(--accent);
  display:none;touch-action:none;box-shadow:0 1px 4px #0004}
.scorebox.sel .scoreresize{display:block}
.doc[data-view="notes"]>.lyrics-pane,.doc[data-view="notes"]>.chords-pane,.doc[data-view="notes"]>.score-empty,.doc[data-view="notes"]>.recordings-pane,
.doc[data-view="lyrics"]>.editor,.doc[data-view="lyrics"]>.ink,.doc[data-view="lyrics"]>.tbox,.doc[data-view="lyrics"]>.scorebox,.doc[data-view="lyrics"]>.chords-pane,.doc[data-view="lyrics"]>.score-empty,.doc[data-view="lyrics"]>.recordings-pane,
.doc[data-view="chords"]>.editor,.doc[data-view="chords"]>.ink,.doc[data-view="chords"]>.tbox,.doc[data-view="chords"]>.scorebox,.doc[data-view="chords"]>.lyrics-pane,.doc[data-view="chords"]>.score-empty,.doc[data-view="chords"]>.recordings-pane,
.doc[data-view="score"]>.editor,.doc[data-view="score"]>.ink,.doc[data-view="score"]>.tbox,.doc[data-view="score"]>.lyrics-pane,.doc[data-view="score"]>.chords-pane,.doc[data-view="score"]>.recordings-pane,
.doc[data-view="recordings"]>.editor,.doc[data-view="recordings"]>.ink,.doc[data-view="recordings"]>.tbox,.doc[data-view="recordings"]>.scorebox,.doc[data-view="recordings"]>.lyrics-pane,.doc[data-view="recordings"]>.chords-pane,.doc[data-view="recordings"]>.score-empty{display:none!important}
.doc:not([data-view="score"])>.scorebox{display:none!important}
.category-pane{position:relative;z-index:1;color:var(--ink)}
.lyrics-pane{min-height:100%;outline:none;padding:32px 24px 70px 46px;white-space:pre-wrap;user-select:text;-webkit-user-select:text;
  font-family:"Iowan Old Style","Palatino Linotype",Palatino,Charter,Georgia,serif;font-size:19px;line-height:1.72}
.lyrics-pane:empty::before,.chord-lyric:empty::before{content:attr(data-ph);opacity:.28;font-style:italic}
.chords-pane{padding:12px 12px 16px 40px;display:flex;flex-direction:column;justify-content:flex-start;min-height:100%;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
/* Estaba pegada abajo pero metida en la columna, con scroll horizontal: los
   últimos botones —«＋ Línea»— se salían por la derecha y había que rascar la
   barra para verlos. Ahora flota, se despliega entera en varias filas si hace
   falta, y se puede arrastrar de la agarradera a donde estorbe menos. */
.chord-tools{position:fixed;z-index:46;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
  display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:5px;padding:5px;
  max-width:calc(100vw - 16px);border-radius:13px;touch-action:none;
  background:#181a1ff2;color:#f3f1eb;box-shadow:0 8px 22px #0006;backdrop-filter:blur(10px)}
.chord-tools.free{left:auto;right:auto;top:auto;transform:none}
body.player-open .chord-tools:not(.free){bottom:172px}
body.panel-abierto .chord-tools,body.score-editing .chord-tools{display:none}
/* Cuelga del body, así que se esconde sola cuando no estamos en el cifrado. */
body:not([data-view="chords"]) .chord-tools,body[data-lock="1"] .chord-tools{display:none}
.chord-grip{flex:0 0 auto;width:26px;height:30px;display:grid;place-items:center;border-radius:7px;
  color:#d6b36a;font-size:13px;cursor:grab;touch-action:none}
.chord-tools>button,.chord-step{flex:0 0 auto;height:30px;border:1px solid #ffffff16;border-radius:7px;background:#ffffff09}
.chord-tools>button.chord-grip{border:0;background:none}
.chord-tools>button{padding:0 9px;font:700 10px/1 ui-monospace,monospace}
.chord-step{display:flex;align-items:center;overflow:hidden}
.chord-step button{width:28px;height:30px;color:#d6b36a;font-size:16px}
.chord-step output{min-width:58px;text-align:center;font:700 9px/1 ui-monospace,monospace}
.chord-help{order:-1;padding:4px 3px 8px;color:var(--soft);font:10px/1.3 ui-sans-serif,sans-serif}
.chord-lines{order:-1;flex:1;padding-top:3px}
.chord-line{position:relative;min-height:67px;border-bottom:1px solid #0000000b}
.chord-lane{position:relative;height:31px;cursor:crosshair}
.chord-lane::after{content:"";position:absolute;left:0;right:0;bottom:2px;border-bottom:1px dashed #00000013}
.chord-chip{position:absolute;z-index:2;bottom:3px;transform:translateX(-4px);padding:3px 5px;border-radius:5px;
  background:#26345a;color:#fff8dc;box-shadow:0 1px 4px #0003;font:800 12px/1 ui-monospace,monospace}
.chord-lyric{min-height:34px;padding:3px 2px 9px;outline:none;white-space:pre-wrap;user-select:text;-webkit-user-select:text;
  font:500 17px/1.45 "Iowan Old Style",Georgia,serif}
.score-empty{position:absolute;left:8%;right:8%;top:54px;height:150px;border:1px dashed #0002;border-radius:12px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--soft)}
.score-empty b{font-size:30px;font-weight:300}.score-empty span{font-size:12px}
.doc.has-scores>.score-empty{display:none!important}
.recordings-pane{min-height:100%;padding:18px 16px 90px 42px;font-family:ui-sans-serif,-apple-system,"Segoe UI",sans-serif}
.record-toolbar{display:flex;align-items:center;gap:8px;padding:8px 0 14px;border-bottom:1px solid #00000012}
.record-toolbar button{height:34px;padding:0 13px;border-radius:9px;background:#1b1e24;color:#f4f1ea;font-size:11px;font-weight:750}
.record-toolbar button.recording{background:#a73333}.record-meta{font:9px/1.35 ui-monospace,monospace;color:var(--soft)}
.record-empty{padding:34px 8px;text-align:center;color:var(--soft);font-size:12px}
.record-item{display:flex;align-items:center;gap:8px;min-height:46px;border-bottom:1px solid #0000000d}
.record-play{flex:1;min-width:0;text-align:left;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.record-play b{display:inline-grid;place-items:center;width:26px;height:26px;margin-right:8px;border-radius:50%;background:var(--ink);color:var(--paper);font-size:9px}
.record-delete{width:30px;height:30px;border-radius:7px;color:#a33;font-size:17px}
.paper[data-s="dark"] .record-toolbar{border-color:#ffffff14}.paper[data-s="dark"] .record-item{border-color:#ffffff0f}
#chordPicker{position:fixed;inset:0;z-index:105;display:none;align-items:center;justify-content:center;padding:8px;
  background:#0005;backdrop-filter:blur(2px)}
#chordPicker.open{display:flex}

#playToggle:active{transform:scale(.94)}
/* Sonando se pone del color de la casa y con un halo: se sabe de un vistazo
   si hay música sin tener que mirar el icono. */

/* Hilo de posición en el canto de arriba del reproductor: dice dónde va la

const toastEl=document.getElementById('toast'), dot=document.getElementById('dot');
let pages=[], cur=0, mode='text', tool='pen', color=PALETTE[0], full=false;
const el=(t,c)=>{const n=document.createElement(t);if(c)n.className=c;return n};
const uid=()=>('song-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8));
const pageTitle=p=>((p.ed.innerText||'').trim().split(/\n/)[0]||'Canción sin título').slice(0,90);
/** El nombre del audio descargado; si no lo hay, el encabezado de la hoja.
 *  `pageTitle` es la primera linea de lo escrito en Apuntes, que es el nombre
 *  de la **pagina**, no el del track: el reproductor decia «Canción sin
 *  título» o lo que hubiera garabateado arriba, en vez del nombre real. */
const trackTitle=p=>{
  if(!p)return '';
  const st=trackState(p);
  return ((st&&st.title)||'').trim()||pageTitle(p);
};
/* almacén: artefacto de Claude o localStorage si abres el HTML descargado */
const store={
  async get(k){
    try{ if(window.storage){const r=await window.storage.get(k);return r&&r.value} }catch(e){}
    try{ return localStorage.getItem(k) }catch(e){ return null }
  },
  async set(k,v){
    if(window.storage)return window.storage.set(k,v);
    localStorage.setItem(k,v);
  }
};
const toast=m=>{toastEl.textContent=m;toastEl.classList.add('on');clearTimeout(toastEl._i);toastEl._i=setTimeout(()=>toastEl.classList.remove('on'),1800)};
ScoreBlocks.init({
  getZoom:()=>zoom,
  isLocked:()=>locked,
  onLayout:p=>{reflow(p);redraw(p)},
  onChange:p=>{reflow(p);recordHistory(p);save()},
  onScorePlay:()=>{if(window.Native&&Native.pause)Native.pause()}
});
SongViews.init({
  currentPage:()=>pages[cur],
  addScore:p=>{SongViews.set(p,'score',true);ScoreBlocks.add(p)},
  renderRecordings:p=>renderSongRecordings(p),
  toast,
  onView:view=>{if(view!=='notes')setArm(false);hideFmt();hidePop()},
  onLayout:p=>{reflow(p);redraw(p)},
  onChange:p=>{reflow(p);recordHistory(p);save()}
});

/* ═══ página ═══ */
function newPage(at=pages.length,data=null){
  const slot=el('div','slot'), paper=el('div','paper'), sheet=el('div','sheet');
  const zoomer=el('div','zoomer'), doc=el('div','doc');
  const ed=el('div','editor'); ed.dataset.ph='Escribe aquí…'; ed.spellcheck=false;
  const cv=el('canvas','ink');
  doc.append(ed,cv); zoomer.append(doc); sheet.append(zoomer); paper.append(sheet); slot.append(paper);
  const chip=el('button','linkchip'); chip.innerHTML='▶ YouTube'; paper.appendChild(chip);
  const p={id:(data&&data.id)||uid(),slot,paper,sheet,zoomer,doc,ed,cv,ctx:cv.getContext('2d'),chip,link:(data&&data.link)||'',
    strokes:[],scores:[],h:0,undo:[],redo:[],last:null};
  setLink(p,p.link,true);
  if(data){ed.innerHTML=data.html||'';p.strokes=data.strokes||[]}
  setStyle(p,(data&&data.style)||pageStyle,true);
  ed.contentEditable=false;
  ed.addEventListener('pointerdown',e=>{p._tx=e.clientX;p._ty=e.clientY});
  ed.addEventListener('pointerup',e=>{
    if(mode!=='text'||locked||ed.isContentEditable)return;
    if(Math.hypot(e.clientX-(p._tx||0),e.clientY-(p._ty||0))>8)return;   // fue un scroll
    if(boxArm)return;
    ed.contentEditable=true; ed.focus();
    const r=document.caretRangeFromPoint?document.caretRangeFromPoint(e.clientX,e.clientY):null;
    if(r){const s=getSelection();s.removeAllRanges();s.addRange(r)}
  });
  ed.addEventListener('blur',()=>{ed.contentEditable=false;hideFmt();hideSub()});
  doc.addEventListener('pointerup',e=>{                       // caja de texto donde toques
    if(!boxArm||mode!=='text'||locked)return;
    if(e.target.closest('.tbox'))return;
    const r=doc.getBoundingClientRect(), W=r.width/zoom;
    addBox(p,{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/(r.width),w:.5,html:''},true);
    setArm(false);
  });
  (data&&data.boxes||[]).forEach(b=>addBox(p,b));
  (data&&data.scores||[]).forEach(s=>ScoreBlocks.add(p,s,false));
  SongViews.attach(p,data&&data.views);
  watchImgs(p);
  bindInk(p);
  ed.addEventListener('input',()=>{reflow(p);recordHistory(p);save()});
  ed.addEventListener('paste',e=>onPaste(e,p));
  if(at>=pages.length){scroller.appendChild(slot);pages.push(p)}
  else{scroller.insertBefore(slot,pages[at].slot);pages.splice(at,0,p)}
  p.last=snap(p); reflow(p); count();
  return p;
}
function delPage(i){
  if(pages.length<2)return toast('Debe quedar una página');
  if(window.Native)Native.removeTrack(pages[i].id);
  pages[i].slot.remove(); pages.splice(i,1); count(); buildIndex(); save();
}

function watchImgs(p){
  p.ed.querySelectorAll('img').forEach(i=>{
    if(i._w)return; i._w=1;
    i.addEventListener('load',()=>{reflow(p);redraw(p)});
  });
}
function setLink(p,url,quiet){
  const before=p.link;
  url=(url||'').trim();
  if(url&&!/^https?:\/\//i.test(url))url='https://'+url;
  p.link=url; p.chip.classList.toggle('on',!!url);
  if(!quiet&&before&&before!==url&&window.Native)Native.removeTrack(p.id);
  refreshTrack(p);
  if(!quiet)save();
}
const STYLES=[['ruled','Rayado'],['grid','Cuadrícula'],['dots','Puntos'],['plain','Blanca'],['dark','Negra']];
function setStyle(p,s,quiet){
  if(!p||!STYLES.some(x=>x[0]===s))return;
  p.style=s; pageStyle=s; p.paper.dataset.s=s; p.doc.dataset.s=s;
  const i=PALETTE.indexOf(penColor), j=DARKPAL.indexOf(penColor);
  if(s==='dark'&&i>=0)penColor=DARKPAL[i]; else if(s!=='dark'&&j>=0)penColor=PALETTE[j];
  if(typeof penSw!=='undefined')penSw.style.background=penColor;
  if(!quiet){reflow(p);redraw(p);save();toast('Hoja: '+(STYLES.find(x=>x[0]===s)||[])[1])}
}
const pal=()=>pages[cur]&&pages[cur].style==='dark'?DARKPAL:PALETTE;

/* ═══ cajas de texto libres ═══ */
let boxArm=false, zoom=1, locked=false;
function setArm(v){boxArm=v;tBox.classList.toggle('on',v);if(v)toast('Toca la hoja donde quieres escribir')}
function layoutBoxes(p){
  const W=p.doc.clientWidth||1;
  p.doc.querySelectorAll('.tbox').forEach(b=>{
    b.style.left=(parseFloat(b.dataset.x)*W)+'px';
    b.style.top=(parseFloat(b.dataset.y)*W)+'px';
    b.style.width=(parseFloat(b.dataset.w)*W)+'px';
  });
}
function addBox(p,d,focus){
  const b=el('div','tbox'); b.dataset.x=d.x; b.dataset.y=d.y; b.dataset.w=d.w||.5;
  b.innerHTML=d.html||''; b.dataset.ph='texto…';
  const g=el('button','bh'), rz=el('button','br');
  b.append(g,rz);
  b.addEventListener('pointerup',e=>{
    if(mode!=='text'||locked||b.isContentEditable||e.target.closest('.bh,.br'))return;
    selBox(b); b.contentEditable=true; b.focus();
  });
  b.addEventListener('blur',()=>{
    b.contentEditable=false;
    if(!b.textContent.trim()){b.remove()}
    reflow(p); recordHistory(p); save();
  });
  b.addEventListener('input',()=>{reflow(p);recordHistory(p);save()});
  let m=null;
  const grab=(e,k)=>{e.stopPropagation();e.preventDefault();selBox(b);
    const W=p.doc.clientWidth;
    m={k,sx:e.clientX,sy:e.clientY,x:+b.dataset.x,y:+b.dataset.y,w:+b.dataset.w,W:W*zoom};
    e.target.setPointerCapture(e.pointerId)};
  g.addEventListener('pointerdown',e=>grab(e,'mv'));
  rz.addEventListener('pointerdown',e=>grab(e,'rz'));
  const mv=e=>{if(!m)return;e.preventDefault();
    const dx=(e.clientX-m.sx)/m.W, dy=(e.clientY-m.sy)/m.W;
    if(m.k==='rz')b.dataset.w=Math.max(.12,Math.min(1,m.w+dx));
    else{b.dataset.x=Math.max(0,Math.min(.95,m.x+dx));b.dataset.y=Math.max(0,m.y+dy)}
    layoutBoxes(p)};
  const end=()=>{if(m){m=null;reflow(p);recordHistory(p);save()}};
  [g,rz].forEach(h=>{h.addEventListener('pointermove',mv);h.addEventListener('pointerup',end);h.addEventListener('pointercancel',end)});
  p.doc.appendChild(b); layoutBoxes(p);
  if(focus){selBox(b);b.contentEditable=true;setTimeout(()=>b.focus(),20)}
  return b;
}
function selBox(b){document.querySelectorAll('.tbox.sel').forEach(x=>{if(x!==b)x.classList.remove('sel')});b&&b.classList.add('sel')}
document.addEventListener('pointerdown',e=>{
  if(!e.target.closest('.tbox'))selBox(null);
  if(!e.target.closest('.scorebox'))document.querySelectorAll('.scorebox.sel').forEach(x=>x.classList.remove('sel'));
},true);
tBox.onclick=()=>{hidePop();setArm(!boxArm)};

/* ═══ bloqueo (solo lectura / scroll) ═══ */
tLock.onclick=()=>{
  locked=!locked; document.body.dataset.lock=locked?'1':'0';
  tLock.classList.toggle('on',locked);
  if(locked){
    if(voiceRecording&&window.Native&&Native.stopVoiceNote)Native.stopVoiceNote();
    setArm(false);hideFmt();hidePop();quickAdd.classList.remove('open');SongViews.closePicker();ScoreBlocks.close();
    document.querySelectorAll('.tbox.sel,.scorebox.sel').forEach(x=>x.classList.remove('sel'));
    document.activeElement.blur&&document.activeElement.blur();
  }
  toast(locked?'Bloqueado — solo lectura':'Edición activada');
};

/* ═══ zoom (pellizco) ═══ */
function setZoom(z){
  zoom=Math.max(.35,Math.min(3,z));
  document.body.classList.toggle('zoomed',zoom>1.02);
  pages.forEach(p=>{reflow(p);redraw(p)});
}
const pz=new Map(); let pzBase=null, zooming=false;
const midOf=pts=>{const[a,b]=pts;return{x:(a.clientX+b.clientX)/2,y:(a.clientY+b.clientY)/2}};
scroller.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse')return; pz.set(e.pointerId,e);
  if(pz.size===2){
    const pts=[...pz.values()],m=midOf(pts),sh=pages[cur]&&pages[cur].sheet;
    pzBase={d:Math.hypot(pts[0].clientX-pts[1].clientX,pts[0].clientY-pts[1].clientY),z:zoom,
            mx:m.x,my:m.y,sl:sh?sh.scrollLeft:0,st:sh?sh.scrollTop:0};
  }
},true);
scroller.addEventListener('pointermove',e=>{
  if(!pz.has(e.pointerId))return; pz.set(e.pointerId,e);
  if(pz.size===2&&pzBase){
    const pts=[...pz.values()],m=midOf(pts);
    const d=Math.hypot(pts[0].clientX-pts[1].clientX,pts[0].clientY-pts[1].clientY);
    if(Math.abs(d-pzBase.d)>12){zooming=true;sw=null;setZoom(pzBase.z*d/pzBase.d)}
    // el mismo gesto arrastra la hoja: dos dedos mueven, no escriben
    const sh=pages[cur]&&pages[cur].sheet;
    if(sh&&(Math.abs(m.x-pzBase.mx)>4||Math.abs(m.y-pzBase.my)>4)){
      zooming=true;sw=null;
      sh.scrollLeft=pzBase.sl-(m.x-pzBase.mx);
      sh.scrollTop=pzBase.st-(m.y-pzBase.my);
      e.preventDefault();
    }
  }
},true);
/* Arrastrar con un dedo cuando la hoja está ampliada.
   Ampliada, `.sheet` lleva `touch-action:none` para que el pellizco no pelee
   con el desplazamiento del navegador; el efecto colateral era que ya no se
   podía mover la hoja con un dedo y había que usar dos. Aquí se devuelve ese
   arrastre. En modo tinta no, que ahí un dedo dibuja. */
let pan=null;
scroller.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'||pz.size!==1||zoom<=1.02||mode==='ink')return;
  const sh=pages[cur]&&pages[cur].sheet; if(!sh)return;
  pan={x:e.clientX,y:e.clientY,sl:sh.scrollLeft,st:sh.scrollTop,sh,moved:false};
},true);
scroller.addEventListener('pointermove',e=>{
  if(!pan||pz.size!==1)return;
  const dx=e.clientX-pan.x, dy=e.clientY-pan.y;
  if(!pan.moved&&Math.hypot(dx,dy)<6)return;      // un toque no es un arrastre
  pan.moved=true; zooming=true; sw=null;
  pan.sh.scrollLeft=pan.sl-dx; pan.sh.scrollTop=pan.st-dy;
  e.preventDefault();
},true);

const pzEnd=e=>{pz.delete(e.pointerId);if(pan&&pz.size===0){const m=pan.moved;pan=null;if(m)setTimeout(()=>zooming=false,120)}
  if(pz.size<2){pzBase=null;setTimeout(()=>zooming=false,120)}};
scroller.addEventListener('pointerup',pzEnd,true); scroller.addEventListener('pointercancel',pzEnd,true);
addEventListener('wheel',e=>{if(e.ctrlKey){e.preventDefault();setZoom(zoom-e.deltaY*.002)}},{passive:false});

/* ═══ pergamino: alto dinámico ═══ */
function reflow(p){
  const W=p.doc.clientWidth||1;
  let deep=0; p.strokes.forEach(s=>s.p.forEach(q=>{if(q[1]>deep)deep=q[1]}));
  let bDeep=0; p.doc.querySelectorAll('.tbox').forEach(b=>{
    const v=parseFloat(b.dataset.y)*W+b.offsetHeight; if(v>bDeep)bDeep=v});
  const scoreDeep=ScoreBlocks.deepest(p),viewDeep=SongViews.deepest(p);
  const tail=p.view==='notes'?TAIL:190;
  const need=Math.max(p.ed.offsetHeight, deep*W, bDeep, scoreDeep, viewDeep, p.sheet.clientHeight/zoom)+tail;
  const h=Math.ceil(need/400)*400;
  if(h!==p.h||p.cv.width!==Math.round(W*DPR())){p.h=h;sizeCanvas(p)}
  p.doc.style.height=h+'px';
  p.zoomer.style.transform='scale('+zoom+')';
  p.zoomer.style.height=(h*zoom)+'px';
  layoutBoxes(p);
  ScoreBlocks.layout(p);
}
const DPR=()=>Math.min(devicePixelRatio||1,2);
function sizeCanvas(p){
  const W=p.doc.clientWidth||1, r=DPR();
  p.cv.width=Math.round(W*r); p.cv.height=Math.round(p.h*r);
  p.cv.style.height=p.h+'px';
  p.ctx.setTransform(r,0,0,r,0,0);
  redraw(p);
}
function redraw(p){
  const W=p.doc.clientWidth||1, c=p.ctx;
  c.clearRect(0,0,W,p.h);
  p.strokes.forEach(s=>path(c,s,W));
}
function path(c,s,W){
  c.globalAlpha=s.t==='hi'?.35:1; c.strokeStyle=s.c;
  c.lineWidth=(s.w||(s.t==='hi'?.055:.0055))*W; c.lineCap='round'; c.lineJoin='round';
  c.beginPath();
  s.p.forEach(([x,y],i)=>{const X=x*W,Y=y*W;i?c.lineTo(X,Y):c.moveTo(X,Y)});
  if(s.p.length===1)c.lineTo(s.p[0][0]*W+.01,s.p[0][1]*W);
  c.stroke(); c.globalAlpha=1;
}

/* ═══ tinta ═══ */
function bindInk(p){
  const pts=new Map(); let live=null, pan=null;
  const loc=e=>{const r=p.cv.getBoundingClientRect(),W=r.width;return[(e.clientX-r.left)/W,(e.clientY-r.top)/W]};
  p.cv.addEventListener('pointerdown',e=>{
    if(mode!=='ink')return; e.preventDefault();
    pts.set(e.pointerId,e);
    if(pts.size>1){ if(live){p.strokes.pop();live=null;redraw(p)} pan={y:e.clientY,x:e.clientX,top:p.sheet.scrollTop,done:0}; return }
    p.cv.setPointerCapture(e.pointerId);
    const q=loc(e);
    if(tool==='er')return erase(p,q);
    live={t:tool,c:tool==='hi'?hiColor:penColor,w:tool==='hi'?hiW:penW,p:[q]}; p.strokes.push(live);
    drawSeg(p);
  });
  p.cv.addEventListener('pointermove',e=>{
    if(mode!=='ink'||!pts.has(e.pointerId))return; e.preventDefault();
    pts.set(e.pointerId,e);
    if(pan&&pts.size>1){
      if(zooming)return;
      const dx=e.clientX-pan.x, dy=e.clientY-pan.y;
      if(!pan.done&&Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.4){pan.done=1;goto(cur+(dx<0?1:-1));return}
      if(!pan.done)p.sheet.scrollTop=pan.top-dy;
      return;
    }
    const q=loc(e);
    if(tool==='er')return erase(p,q);
    if(!live)return;
    live.p.push(q); drawSeg(p);
    if(q[1]*p.doc.clientWidth>p.h-300)reflow(p);
  });
  const up=e=>{
    pts.delete(e.pointerId); if(pts.size===0)pan=null;
    if(live||p._erased){live=null;p._erased=false;reflow(p);recordHistory(p);save()}
  };
  p.cv.addEventListener('pointerup',up); p.cv.addEventListener('pointercancel',up);
  function drawSeg(){
    const W=p.doc.clientWidth,c=p.ctx,n=live.p.length;
    if(n<2)return path(c,live,W);
    const a=live.p[n-2],b=live.p[n-1];
    c.globalAlpha=live.t==='hi'?.35:1;c.strokeStyle=live.c;
    c.lineWidth=(live.w||.0055)*W;c.lineCap='round';c.lineJoin='round';
    c.beginPath();c.moveTo(a[0]*W,a[1]*W);c.lineTo(b[0]*W,b[1]*W);c.stroke();c.globalAlpha=1;
  }
}
function erase(p,q){
  const r=.03, before=p.strokes.length;
  p.strokes=p.strokes.filter(s=>!s.p.some(([x,y])=>Math.hypot(x-q[0],y-q[1])<r));
  if(p.strokes.length!==before){p._erased=true;redraw(p)}
}

/* ═══ historial (texto + tinta) ═══ */
const snap=p=>JSON.stringify({h:p.ed.innerHTML,s:p.strokes,b:boxData(p),q:ScoreBlocks.serialize(p),v:SongViews.serialize(p)});
let hT;
function recordHistory(p){
  clearTimeout(hT); hT=setTimeout(()=>{
    const s=snap(p); if(s===p.last)return;
    p.undo.push(p.last); if(p.undo.length>MAXH)p.undo.shift();
    p.last=s; p.redo=[]; btns();
  },450);
}
function apply(p,s){
  const d=JSON.parse(s); p.ed.innerHTML=d.h; p.strokes=d.s;
  p.doc.querySelectorAll('.tbox').forEach(b=>b.remove());
  (d.b||[]).forEach(b=>addBox(p,b));
  ScoreBlocks.clear(p);(d.q||[]).forEach(q=>ScoreBlocks.add(p,q,false));
  SongViews.restore(p,d.v||{});
  watchImgs(p); reflow(p); redraw(p); buildIndex(); save(); btns();
}
function doUndo(){const p=pages[cur];clearTimeout(hT);if(!p.undo.length)return toast('Nada que deshacer');
  p.redo.push(p.last);p.last=p.undo.pop();apply(p,p.last)}
function doRedo(){const p=pages[cur];if(!p.redo.length)return toast('Nada que rehacer');
  p.undo.push(p.last);p.last=p.redo.pop();apply(p,p.last)}
function btns(){const p=pages[cur];if(!p)return;
  bUndo.disabled=!p.undo.length;bRedo.disabled=!p.redo.length}
bUndo.onclick=doUndo; bRedo.onclick=doRedo;
addEventListener('keydown',e=>{
  if(!(e.metaKey||e.ctrlKey))return;
  if(e.key==='z'&&!e.shiftKey){e.preventDefault();doUndo()}
  if(e.key==='y'||(e.key==='z'&&e.shiftKey)){e.preventDefault();doRedo()}
});

/* ═══ navegación ═══ */
function count(){document.getElementById('count').textContent=String(cur+1).padStart(2,'0')+' / '+String(pages.length).padStart(2,'0');btns();SongViews.refresh(pages[cur]);updatePlayerPage()}
function goto(i){cur=Math.max(0,Math.min(pages.length-1,i));pages[cur].slot.scrollIntoView({inline:'center',block:'nearest'});count()}
scroller.addEventListener('scroll',()=>{const i=Math.round(scroller.scrollLeft/scroller.clientWidth);if(i!==cur){cur=i;count();hideFmt()}},{passive:true});
/* deslizado horizontal propio: funciona desde el centro de la hoja,
   sin pelear con el gesto de "atrás" del borde del teléfono */
let sw=null;
scroller.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'||mode!=='text')return;
  if(e.target.closest('[contenteditable="true"],.chord-tools,.chord-lane,.scorebox'))return;
  const ed=pages[cur]&&pages[cur].ed;
  if(ed&&ed.isContentEditable&&e.target.closest('.editor'))return;   // escribiendo: no interferir
  sw={id:e.pointerId,x:e.clientX,y:e.clientY,done:0};
});
scroller.addEventListener('pointermove',e=>{
  if(!sw||sw.done||e.pointerId!==sw.id)return;
  const dx=e.clientX-sw.x, dy=e.clientY-sw.y;
  if(Math.abs(dx)>46&&Math.abs(dx)>Math.abs(dy)*1.2){sw.done=1;goto(cur+(dx<0?1:-1))}
});
const swEnd=()=>sw=null;
scroller.addEventListener('pointerup',swEnd); scroller.addEventListener('pointercancel',swEnd);

/* trackpad / rueda horizontal (o Shift+rueda) cambia de página */
let wheelLock=0;
addEventListener('wheel',e=>{
  const h=e.shiftKey?e.deltaY:e.deltaX;
  if(Math.abs(h)<18||Math.abs(h)<Math.abs(e.deltaY)&&!e.shiftKey)return;
  if(Date.now()<wheelLock)return; wheelLock=Date.now()+420;
  goto(cur+(h>0?1:-1));
},{passive:true});
addEventListener('keydown',e=>{
  if(document.activeElement?.isContentEditable||document.activeElement?.closest?.('input,textarea'))return;
  if(e.key==='ArrowRight')goto(cur+1); if(e.key==='ArrowLeft')goto(cur-1);
});
const quickAdd=document.getElementById('quickAdd');
addPage.onclick=e=>{e.stopPropagation();quickAdd.classList.toggle('open')};
document.getElementById('quickPage').onclick=()=>{
  quickAdd.classList.remove('open');newPage(cur+1);buildIndex();setTimeout(()=>goto(cur+1),40);save();
};
document.getElementById('quickScore').onclick=()=>{
  quickAdd.classList.remove('open');if(locked)return toast('Desbloquea la edición');
  SongViews.set(pages[cur],'score');
  ScoreBlocks.add(pages[cur]);
};
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#quickAdd,#addPage'))quickAdd.classList.remove('open')});

function placeDock(x,y){
  const w=wrap.offsetWidth,h=wrap.offsetHeight;
  // Con el reproductor abierto, el suelo es su techo: si no, la barra se
  // queda encima de los controles de la canción y estorba a los dos.
  const abajo=document.body.classList.contains('player-open')
    ? Math.max(56,innerHeight-(document.getElementById('player').offsetHeight||0)-h-8)
    : innerHeight-h-6;
  x=Math.max(6,Math.min(innerWidth-w-6,x)); y=Math.max(50,Math.min(abajo,y));
  wrap.classList.add('free'); wrap.style.left=x+'px'; wrap.style.top=y+'px'; wrap.style.bottom='auto';
  wrap.classList.toggle('below',y<innerHeight*.42);
}

function insertImg(p,src){
  if(mode!=='text')setMode('text');
  p.ed.focus();
  const s=getSelection(); let r=null;
  if(s&&s.rangeCount){const t=s.getRangeAt(0);if(p.ed.contains(t.commonAncestorContainer))r=t}
  if(!r){r=document.createRange();r.selectNodeContents(p.ed);r.collapse(false);s.removeAllRanges();s.addRange(r)}
  const img=document.createElement('img'); img.src=src;
  const br=document.createElement('div'); br.innerHTML='<br>';
  r.deleteContents(); r.insertNode(img); img.after(br);
  r.setStartAfter(br); r.collapse(true); s.removeAllRanges(); s.addRange(r);
  img.addEventListener('load',()=>{reflow(p);redraw(p);save()});
  watchImgs(p); reflow(p); recordHistory(p); save();
}
function readImg(p,f){
  const fr=new FileReader();
  fr.onload=()=>{
    const im=new Image();
    im.onload=()=>{
      const max=1400, k=Math.min(1,max/im.naturalWidth);
      let out=fr.result;
      if(k<1||fr.result.length>400000){
        const c=document.createElement('canvas');
        c.width=Math.round(im.naturalWidth*k); c.height=Math.round(im.naturalHeight*k);
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        const png=/png|webp|gif/.test(f.type);
        try{const d=c.toDataURL(png?'image/png':'image/jpeg',.85); if(d.length<out.length)out=d}catch(e){}
      }
      insertImg(p,out);
    };
    im.onerror=()=>insertImg(p,fr.result);
    im.src=fr.result;
  };
  fr.readAsDataURL(f);
}
tImg.onclick=()=>document.getElementById('file').click();
document.getElementById('file').onchange=e=>{const f=e.target.files[0];if(f)readImg(pages[cur],f);e.target.value=''};
function onPaste(e,p){
  const it=[...(e.clipboardData?.items||[])], img=it.find(i=>i.type.startsWith('image/'));
  if(img){e.preventDefault();readImg(p,img.getAsFile());return}
  const t=e.clipboardData?.getData('text/plain');
  if(t!=null){e.preventDefault();document.execCommand('insertText',false,t);reflow(p);recordHistory(p);save()}
}

function playlistStep(direction,fromId=(now.songId||now.id),wrap=false){
  const ready=downloadedPages();
  if(!ready.length)return toast('No hay canciones descargadas');
  const at=ready.findIndex(p=>p.id===fromId);
  let ni=at<0?(direction>0?0:ready.length-1):at+direction;
  if(wrap)ni=(ni+ready.length)%ready.length;
  const next=ready[ni];
  if(!next)return toast(direction>0?'Fin de la lista':'Inicio de la lista');
  playPage(next);

let cambioDePista=0;
function updatePlayerPage(){
  if(!pages.length)return;
  const p=pages[cur], st=trackState(p), different=now.id&&(now.kind==='voice'||(now.songId||now.id)!==p.id);
  const ready=downloadedPages(),qi=ready.findIndex(x=>x.id===(now.songId||now.id));
  queuePos.textContent=ready.length?(qi>=0?(qi+1)+' / '+ready.length:'— / '+ready.length):'0 / 0';
  nowTitle.textContent=now.id?('Suena · '+(now.title||trackTitle(p))):trackTitle(p);
  cajaPlayer.classList.toggle('sonando',!!now.playing);
  if(!st.downloaded){
    pageAction.style.display='block';pageAction.disabled=!p.link;
    pageAction.textContent=p.link?'↓ Descargar':'Sin audio';
    pageAction.onclick=()=>downloadPage(p);
  }else if(different){
    // Llegar a la página de otra canción descargada es elegirla. Si ya había
    // música sonando se cambia sola —nada de dejar una segunda pista servida
    // esperando—; si no sonaba nada, queda el botón para tocarla.
    pageAction.style.display='block';pageAction.disabled=false;
    pageAction.textContent='▶ Reproducir';
    pageAction.onclick=()=>playPage(p);
    clearTimeout(cambioDePista);
    if(now.playing&&now.kind==='song'){
      // un respiro: pasar veinte páginas de corrido no arranca veinte pistas
      cambioDePista=setTimeout(()=>{
        if(pages[cur]===p&&now.playing&&now.kind==='song'&&(now.songId||now.id)!==p.id)playPage(p);
      },420);
    }
  }else{
    pageAction.style.display='none';clearTimeout(cambioDePista);

let prevTap=0;
prevTrack.onclick=()=>{
  const seguido=Date.now()-prevTap<900;
  prevTap=Date.now();
  // Este botón, primero, devuelve la canción a su principio. Antes hacía lo
  // contrario de lo que uno espera: dos toques seguidos se tomaban como «a la
  // anterior», así que darle dos veces para volver a empezar te sacaba de la
  // canción. Ahora los toques seguidos siempre rebobinan —dar dos veces no
  // castiga— y a la pista anterior se va con un toque aparte, ya estando en
  // el principio.
  // Se mira la posición **viva** y no la del último aviso del motor: entre
  // aviso y aviso pasan cien milisegundos y `now.position` se queda corta.
  if(now.id&&(seguido||livePosition()>1200)){
    saltarA(0);return;
  }
  playlistStep(-1,undefined,true);
};

/** Pinta la onda en un lienzo.
 *
 *  `carrilCss` son los píxeles de abajo que no le tocan: en el editor grande
 *  ahí van las banderas. `maciza` cambia el dibujo: la tira chica se pinta con
 *  barritas separadas, que a ese tamaño se leen bien, pero el visor grande
 *  necesitaba otra cosa. Con 180 muestras repartidas en 380 puntos las
 *  barritas salían de punto y medio con dos de hueco, y eso deja de parecer un
 *  tema y pasa a parecer una cenefa. Macizas —cada muestra ocupa su trozo
 *  entero, sin hueco— se ve la forma real del track, que es de lo que se
 *  trataba: son las mismas muestras de siempre, no un relleno.
 */
function pintarOnda(cv,ctx,carrilCss,maciza){
  const dpr=devicePixelRatio||1,r=cv.getBoundingClientRect();
  if(!r.width)return; // el panel cerrado no mide nada y todo saldría en cero
  const W=Math.max(1,Math.round(r.width*dpr)),H=Math.max(1,Math.round(r.height*dpr));
  if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H}ctx.clearRect(0,0,W,H);
  const util=Math.max(1,H-(carrilCss||0)*dpr);
  const hayOnda=now.wave&&now.wave.length;
  const all=hayOnda?now.wave:Array.from({length:80},(_,i)=>.12+.08*Math.sin(i*.7));
  // Sobre cuanto tiempo se repartieron estas muestras. No tiene por que ser la
  // duracion que dice el motor: el extractor, el lector de metadatos y el
  // reproductor discrepan en un MP3 de bitrate variable, y por unos segundos
  // de diferencia el estribillo acababa dibujado donde no suena. Cada muestra
  // se coloca en su segundo, no en su fraccion del array.
  const baseMs=(hayOnda&&now.waveMs>0)?now.waveMs:now.duration;
  const range=waveRange(), span=Math.max(1,range.end-range.start);
  const paso=Math.max(1,baseMs)/all.length;            // cuanto dura una muestra
  const px=now.duration?Math.max(0,Math.min(W,(now.position-range.start)/span*W)):-1;
  const ancho=Math.max(1,paso/span*W);
  const bw=maciza?ancho:Math.max(1.5*dpr,ancho-1.4*dpr), radius=maciza?0:bw/2;
  all.forEach((v,i)=>{
    const x=(i*paso-range.start)/span*W;
    if(x+bw<0||x>W)return;                              // fuera del trozo visible
    const bar=Math.max(maciza?1*dpr:2*dpr,v*util*(maciza?.46:.42));
    ctx.fillStyle=(x<=px)?'#d6b36a':'#6f7683';
    ctx.beginPath();
    // El +.6 tapa la costura entre trozos vecinos: sin él quedan rayitas de
    // fondo entre muestra y muestra y vuelve a parecer una reja.
    if(maciza)ctx.rect(x,util*.5-bar,bw+.6,bar*2);
    else if(ctx.roundRect)ctx.roundRect(x,util*.5-bar,bw,bar*2,radius);
    else ctx.rect(x,util*.5-bar,bw,bar*2);
    ctx.fill();
  });
  if(now.duration){
    if(loopOn||pointB<now.duration||pointA>0){
      const ax=(pointA-range.start)/span*W,bx=(pointB-range.start)/span*W;
      ctx.fillStyle=loopOn?'#d6b36a20':'#ffffff10';
      ctx.fillRect(Math.max(0,ax),0,Math.max(0,Math.min(W,bx)-Math.max(0,ax)),util);
      ctx.fillStyle=loopOn?'#d6b36a':'#ffffff5c';
      if(ax>=0&&ax<=W)ctx.fillRect(ax,0,2*dpr,util);
      if(bx>=0&&bx<=W)ctx.fillRect(bx-2*dpr,0,2*dpr,util);
    }
    if(px>=0){
      ctx.fillStyle='#fffdf7';
      ctx.fillRect(px-1*dpr,3*dpr,2*dpr,util-11*dpr);
      ctx.beginPath();ctx.arc(px,3*dpr,3.2*dpr,0,Math.PI*2);ctx.fill();
    }
  }
}

function waveRange(){const span=now.duration/Math.max(1,waveZoom);if(waveZoom>1&&now.playing&&(now.position<waveOffset||now.position>waveOffset+span))waveOffset=now.position-span*.18;waveOffset=Math.max(0,Math.min(Math.max(0,now.duration-span),waveOffset));return{start:waveOffset,end:Math.min(now.duration,waveOffset+span)}}

const abStage=document.getElementById('abStage'), abWave=document.getElementById('abWave'), abctx=abWave.getContext('2d');
const ABCARRIL=22; // alto del carril donde viven las banderas
let abDrag='';
/** Dónde cae cada bandera. La aguja marca el sitio exacto; la bandera se corre
 *  hacia dentro cuando la marca está pegada a un borde, que si no, se sale. */
function colocarBanderas(){
  const r=abStage.getBoundingClientRect(); if(!r.width)return;
  const v=waveRange(), span=Math.max(1,v.end-v.start);
  abStage.classList.toggle('armed',!!now.duration);
  document.querySelectorAll('.ab-handle').forEach(h=>{
    const ms=h.dataset.h==='a'?pointA:pointB, x=(ms-v.start)/span*r.width;
    h.style.left=x+'px';
    h.style.visibility=(x<-40||x>r.width+40)?'hidden':'visible';
    const f=h.querySelector('.ab-flag');
    let corre=0;
    if(h.dataset.h==='a'&&x+34>r.width)corre=r.width-x-34;
    if(h.dataset.h==='b'&&x-34<0)corre=34-x;
    f.style.transform='translateX('+corre+'px)';
  });
}
function pintarAB(){pintarOnda(abWave,abctx,ABCARRIL,true);colocarBanderas()}
function abTiempo(clientX){
  const r=abStage.getBoundingClientRect(), v=waveRange();
  return v.start+Math.max(0,Math.min(1,(clientX-r.left)/r.width))*(v.end-v.start);
}

  });

// Tocar la onda: con el bucle puesto acerca la marca de al lado, sin bucle

function refreshAB(){

function setPoint(which,value){

let posAnchor={at:0,pos:0,playing:false}, saltoHasta=0;
/** Lleva la aguja a `v` y se lo pide al motor, las dos cosas a la vez. */
function saltarA(v){
  v=Math.max(0,Math.min(now.duration||v,v));
  saltoHasta=performance.now()+300;
  Native.seek(v);now.position=v;
  posAnchor={at:performance.now(),pos:v,playing:now.playing};
  refreshClock();drawWave();
}
/** El motor manda su posición cada poco; entre aviso y aviso la aguja se
   interpola con el reloj de la página para que marque el punto real. */
function livePosition(){
  if(!posAnchor.playing)return posAnchor.pos;
  const p=posAnchor.pos+(performance.now()-posAnchor.at)*(speedValue||1);
  return Math.max(0,Math.min(now.duration||p,p));
}
let raf=0;
function followTrack(){
  raf=0;
  if(!posAnchor.playing)return;
  now.position=livePosition();
  if(loopOn&&pointB>pointA&&now.position>=pointB){now.position=pointA;posAnchor={at:performance.now(),pos:pointA,playing:true}}
  refreshClock();drawWave();
  raf=requestAnimationFrame(followTrack);
}
window.nativePlayerState=d=>{
  const changed=d.id!==now.id;
  // Un salto tarda en cuajar en el motor, y mientras tanto sigue avisando de
  // la posición vieja: la aguja se iba al sitio nuevo y volvía de un tirón.
  // Durante ese cuarto de segundo manda lo que se pidió, no lo que se oye.
  const enSalto=!changed&&performance.now()<saltoHasta;
  const pos=enSalto?now.position:(d.position||0);
  Object.assign(now,d);
  if(enSalto)now.position=pos;
  posAnchor={at:performance.now(),pos:pos,playing:!!d.playing};
  if(d.playing&&!raf)raf=requestAnimationFrame(followTrack);
  if(!d.playing&&raf){cancelAnimationFrame(raf);raf=0}
  if(changed){
    if(d.kind==='voice'){now.wave=voiceWaveCache[d.id]||now.wave||[];now.waveMs=0}
    else{const p=pages.find(x=>x.id===(d.songId||d.id)),st=trackState(p);now.wave=st.wave||[];now.waveMs=st.waveMs||0}
    pointA=0;pointB=d.duration||0;loopOn=false;waveZoom=1;waveOffset=0;loopToggle.classList.remove('on');refreshAB();
  }
  cajaPlayer.classList.toggle('sonando',!!d.playing);refreshClock();updatePlayerPage();
};

/* Búsqueda tolerante: quita tildes, admite trozos sueltos y erratas de una
   o dos letras, y da igual si escribes primero el artista o la canción. */
const plain=t=>(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9ñ ]+/g,' ').replace(/\s+/g,' ').trim();
function editDistance(a,b){
  if(a===b)return 0;
  if(Math.abs(a.length-b.length)>2)return 3;
  const prev=Array.from({length:b.length+1},(_,j)=>j);
  for(let i=1;i<=a.length;i++){
    let last=prev[0];prev[0]=i;
    for(let j=1;j<=b.length;j++){
      const tmp=prev[j];
      prev[j]=Math.min(prev[j]+1,prev[j-1]+1,last+(a[i-1]===b[j-1]?0:1));
      last=tmp;
    }
  }
  return prev[b.length];
}
function searchScore(text,query){
  const hay=plain(text), terms=plain(query).split(' ').filter(Boolean);
  if(!terms.length)return 0;
  const words=hay.split(' ');
  let total=0;
  for(const term of terms){
    let best=-1;
    if(hay.includes(term))best=term.length>=3?3:2;
    else for(const w of words){
      if(w.startsWith(term)){best=Math.max(best,2.5);continue}
      const tol=term.length<=4?1:2;
      const d=editDistance(term,w);
      if(d<=tol)best=Math.max(best,2-d*.4);
      else if(w.length>term.length&&editDistance(term,w.slice(0,term.length))<=tol)best=Math.max(best,1.4);
    }
    if(best<0)return -1;          // si un trozo no aparece, no es esa canción
    total+=best;
  }
  return total;
}
let idxQuery='';
/* Dónde busca el índice. Antes miraba sólo los apuntes y el enlace, así que
   buscar por una palabra de la letra —o por el artista, si está escrito ahí—
   no encontraba nada. */
function searchText(p){
  return [p.ed&&p.ed.innerText, p.lyrics, p.link,
          p.lyricsPane&&p.lyricsPane.innerText,
          p.chordsPane&&p.chordsPane.innerText].filter(Boolean).join(' ');
}

function buildIndex(){
  listEl.innerHTML='';
  const q=idxQuery.trim();
  let shown=0;
  // Con búsqueda, lo que más se parece primero; sin búsqueda, el orden del
  // cuaderno. El número que se ve sigue siendo el de la página y no el del
  // resultado, que si no, reordenar la lista mentiría sobre dónde está cada
  // canción.
  let orden=pages.map((p,i)=>({p,i}));
  if(q){
    orden=orden.map(o=>Object.assign({sc:searchScore(searchText(o.p),q)},o))
               .filter(o=>o.sc>=0)
               .sort((a,b)=>b.sc-a.sc||a.i-b.i);
  }
  orden.forEach(({p,i})=>{
    shown++;
    const r=el('div','row'); r._p=p;
    const t=(p.ed.innerText||'').trim().replace(/\s+/g,' ').slice(0,40);
    const st=trackState(p),job=downloadJobs[p.id];
    const action=job?`${Math.max(0,job.progress||0)}%`:st.downloaded?'▶':'↓';
    const actionTitle=job?(job.state==='processing'?'Guardando MP3':'Descargando'):st.downloaded?'Abrir canción':'Descargar audio';
    const actionClass=job?' busy':st.downloaded?' ready':'';
    r.innerHTML=`<button class="grip">⠿</button><span class="n">${String(i+1).padStart(2,'0')}</span>
      <span class="s${t?'':' empty'}">${t?t.replace(/</g,'&lt;'):'en blanco'}</span>
      <button class="trackact${actionClass}" title="${actionTitle}" aria-label="${actionTitle}" ${job||(!p.link&&!st.downloaded)?'disabled':''}>${action}</button>
      <button class="lk" title="Pegar o editar enlace">🔗</button><button class="x">×</button>`;
    r.querySelector('.trackact').onclick=ev=>{
      ev.stopPropagation();
      if(st.downloaded){idx.classList.remove('open');goto(pages.indexOf(p))}
      else if(!job)downloadPage(p);
    };
    r.querySelector('.lk').onclick=ev=>{
      ev.stopPropagation();
      const inp=el('input','lkin'); inp.value=p.link||''; inp.placeholder='Pega el enlace…';
      r.innerHTML=''; r.appendChild(inp); inp.focus();
      let done=false;
      const finish=()=>{if(done)return;done=true;setLink(p,inp.value);buildIndex()};
      inp.addEventListener('keydown',e=>{if(e.key==='Enter')finish()});
      inp.addEventListener('blur',finish);
    };
    r.querySelector('.x').onclick=ev=>{ev.stopPropagation();delPage(pages.indexOf(p))};
    r.onclick=ev=>{if(ev.target.closest('.grip,.x,.lk,.lkin,.trackact'))return;idx.classList.remove('open');goto(pages.indexOf(p))};
    listEl.appendChild(r);
  });
  if(!shown){
    const e=el('div','idx-empty');
    e.textContent='Nada con «'+q+'». Prueba con menos letras: el buscador aguanta erratas.';
    listEl.appendChild(e);
  }
}

  const p=newPage(pages.length,{html:'<h2>'+clean+'</h2><div><br></div>',link});
  buildIndex();idx.classList.remove('open');goto(pages.indexOf(p));save();
};
let reseedArm=0;
document.getElementById('reseed').onclick=()=>{
  if(Date.now()>reseedArm){reseedArm=Date.now()+4000;toast('Toca otra vez para reemplazar todo');return}
  reseedArm=0; pages.forEach(p=>p.slot.remove()); pages=[]; cur=0; seed(); idx.classList.remove('open');
};
function load(d){
  pages.forEach(p=>p.slot.remove()); pages=[]; cur=0;
  pageStyle=d.style||'ruled'; zoom=d.zoom||1;
  (d.pages||[]).forEach(pd=>newPage(pages.length,pd));
  if(!pages.length)newPage();
  pages.forEach(p=>{watchImgs(p);reflow(p);redraw(p)}); buildIndex(); goto(0);
}

const titleKey=t=>(t||'').split(/[–—]/)[0].trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const LINK_BY_TITLE=new Map(CATALOG.map(([title,id])=>[titleKey(title),id?'https://youtu.be/'+id:'']));
const OLD_SEED_KEYS=new Set(OLD_SEED_TITLES.map(titleKey));
function seed(){
  CATALOG.forEach(([title,id])=>newPage(pages.length,{html:'<h2>'+title+'</h2><div><br></div>',link:id?'https://youtu.be/'+id:''}));
  buildIndex(); goto(0); save();
}
/* Dos canciones tenían el enlace cambiado: el identificador que figuraba en
   «Me Vale – Maná» era en realidad el de «Lobo-hombre en París» —comprobado
   contra el título que devuelve YouTube— y Lobo Hombre se había quedado sin
   ninguno, así que estaba en la lista y no sonaba. Esto lo corrige también en
   los cuadernos ya guardados, donde el enlace equivocado ya está escrito. */
// Ojo: `titleKey` corta en el guion y se queda con lo de delante, asi que la
// clave es «me vale», no «me vale mana».
const MAL_ENLAZADAS=new Set(['me vale','lobo hombre en paris']);
function repairCatalog(version){
  let changed=false;
  if(version<14){
    pages.forEach(p=>{
      const key=titleKey(pageTitle(p));
      if(!MAL_ENLAZADAS.has(key))return;
      const correct=LINK_BY_TITLE.get(key)||'';
      if(correct&&p.link!==correct){
        if(window.Native)Native.removeTrack(p.id);   // el audio bajado tampoco vale
        setLink(p,correct,true);changed=true;
      }
    });
  }
  if(version>=10)return changed;
  const present=new Set();
  pages.forEach(p=>{
    const key=titleKey(pageTitle(p));present.add(key);
    if(!OLD_SEED_KEYS.has(key))return;
    const correct=LINK_BY_TITLE.get(key)||'';
    if(correct&&p.link!==correct){   // sin enlace nuevo no se borra el que había
      if(window.Native)Native.removeTrack(p.id);
      setLink(p,correct,true);changed=true;
    }
  });
  CATALOG.forEach(([title,id])=>{
    const key=titleKey(title);if(present.has(key))return;
    newPage(pages.length,{html:'<h2>'+title+'</h2><div><br></div>',link:id?'https://youtu.be/'+id:''});
    present.add(key);changed=true;
  });
  if(changed){buildIndex();save()}
  return changed;
}
(async()=>{
  let d=null,external=null;
  try{const v=await store.get('cuaderno');d=v&&JSON.parse(v)}catch(e){}
  try{if(window.Native&&Native.restoreBackup){const v=Native.restoreBackup();external=v&&JSON.parse(v)}}catch(e){}
  if(external&&external.pages&&(!d||(+external.savedAt||0)>(+d.savedAt||0)))d=external;
  if(d&&d.pages&&d.pages.length){load(d);repairCatalog(d.v||0)} else seed();
  pages.forEach(p=>{reflow(p);redraw(p)});
})();
