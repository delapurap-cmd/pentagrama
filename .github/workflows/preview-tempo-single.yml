name: Verify one score tempo and score numbering, commit PREVIEW only
on:
  push:
    branches:
      - preview/estabilidad-editor-20260920
    paths:
      - .github/workflows/preview-tempo-single.yml
permissions:
  contents: write
jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore only exact SHA-verified editor patch
        run: |
          python3 - <<'PY'
          import pathlib,base64,lzma,hashlib
          b=''.join(pathlib.Path(f'pruebas/tempo-single-part-{i}.txt').read_text().strip() for i in range(3))
          assert len(b)==13212,('Incomplete patch',len(b))
          packed=base64.b64decode(b,validate=True)
          assert hashlib.sha256(packed).hexdigest()=='6cbb52a1b6b5ff4eb8978fd28899e0493df84c80899e7f6369eee8c0b3960bdd','Compressed patch integrity failed'
          patch=lzma.decompress(packed)
          assert hashlib.sha256(patch).hexdigest()=='34281161b2c3edfa061cbfbc6f9e8d83df7b36ebed0d4a66dc148cbeed40bec6','Source patch integrity failed'
          pathlib.Path('/tmp/tempo-single.patch').write_bytes(patch)
          print('Verified exact intended patch:',len(patch),'bytes')
          PY
          git apply --check /tmp/tempo-single.patch
          git apply /tmp/tempo-single.patch
          git diff --check
          node --check js/app.js
          node --check js/audio.js
          node --check js/engrave.js
          node --check pruebas/tempo-one-clock.cjs
          node --check pruebas/tempo-single-browser.cjs
          ! grep -q 'id="ppVel"' index.html
          ! grep -q 'src="js/pdf-import.js"' index.html
          git diff --stat
      - name: Test count-in against the unique WebAudio timeline and earlier loop/instrument functionality
        run: |
          node pruebas/tempo-one-clock.cjs
          node pruebas/metronome-loop.cjs
          node pruebas/reorg-unit.cjs
          node pruebas/stage2-practice.cjs
      - name: Install real browser driver
        run: npm install --no-save playwright-core@1.55.0
      - name: Test score numbering, spacebar, tempo and SVG toolbar at three sizes
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node pruebas/tempo-single-browser.cjs
      - name: Prevent existing notation, MusicXML and audio synchronization regressions
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          node pruebas/reorg-browser.cjs
          node pruebas/preview-roundtrip.cjs
          node pruebas/sync-inline-browser.cjs
          node pruebas/toolbar-browser.cjs
      - name: Save successfully tested source ONLY to preview branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html js/app.js js/audio.js js/editor-reorg.css js/engrave.js
          git diff --cached --quiet && exit 1
          git commit -m 'Unify score tempo, phase-lock count-in, number systems and draw transport icons'
          git push origin HEAD:preview/estabilidad-editor-20260920
