name: Pentagrama native offline Mac DMG
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/mac/**'
      - 'server/**'
      - 'js/**'
      - 'index.html'
      - 'style.css'
      - '.github/workflows/mac-native-dmg.yml'

jobs:
  dmg:
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test conversion API and install desktop packager
        run: |
          python -m pip install -r server/requirements.txt 'pyinstaller>=6.13,<7'
          python -m unittest discover -s server/tests -v
          python -m py_compile server/app.py server/omr.py server/desktop_service.py
      - name: Compile native Mac window for macOS 12 or later
        shell: bash
        run: |
          set -euo pipefail
          APP='build/Pentagrama.app'
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          swiftc -target x86_64-apple-macos12.0 -O \
            -framework Cocoa -framework WebKit \
            desktop/mac/Pentagrama.swift -o "$APP/Contents/MacOS/Pentagrama"
          test -x "$APP/Contents/MacOS/Pentagrama"
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleDevelopmentRegion</key><string>es</string>
          <key>CFBundleExecutable</key><string>Pentagrama</string>
          <key>CFBundleIdentifier</key><string>com.morethanmodes.pentagrama</string>
          <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
          <key>CFBundleName</key><string>Pentagrama</string>
          <key>CFBundleDisplayName</key><string>Pentagrama</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleShortVersionString</key><string>0.3.0</string>
          <key>CFBundleVersion</key><string>3</string>
          <key>CFBundleIconFile</key><string>Pentagrama</string>
          <key>LSMinimumSystemVersion</key><string>12.0</string>
          <key>NSHighResolutionCapable</key><true/>
          <key>NSAppTransportSecurity</key><dict><key>NSAllowsLocalNetworking</key><true/></dict>
          </dict></plist>
          PLIST
          plutil -lint "$APP/Contents/Info.plist"
          mkdir -p build/Pentagrama.iconset
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" icon-512.png --out "build/Pentagrama.iconset/icon_${size}x${size}.png" > /dev/null
            doubled=$((size*2))
            sips -z "$doubled" "$doubled" icon-512.png --out "build/Pentagrama.iconset/icon_${size}x${size}@2x.png" > /dev/null
          done
          iconutil -c icns build/Pentagrama.iconset -o "$APP/Contents/Resources/Pentagrama.icns"
      - name: Embed original Audiveris with Java runtime
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --show-error --silent \
            'https://github.com/Audiveris/audiveris/releases/download/5.11.0/Audiveris-5.11.0-macosx-x86_64.dmg' \
            --output "$RUNNER_TEMP/Audiveris.dmg"
          mkdir -p "$RUNNER_TEMP/audiveris-volume"
          printf 'y\n' | PAGER=cat hdiutil attach -readonly -nobrowse \
            -mountpoint "$RUNNER_TEMP/audiveris-volume" "$RUNNER_TEMP/Audiveris.dmg"
          APP=$(find "$RUNNER_TEMP/audiveris-volume" -name 'Audiveris.app' -type d -print -quit)
          test -n "$APP"
          ditto "$APP" build/Pentagrama.app/Contents/Resources/Audiveris.app
          hdiutil detach "$RUNNER_TEMP/audiveris-volume"
          BIN=build/Pentagrama.app/Contents/Resources/Audiveris.app/Contents/MacOS/Audiveris
          test -x "$BIN"
          "$BIN" -help > "$RUNNER_TEMP/audiveris-cli.txt" 2>&1
          grep -qi batch "$RUNNER_TEMP/audiveris-cli.txt"
          echo 'PASS: Audiveris packaged and CLI available without installing Java'
      - name: Include complete offline score editor and samples
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package-web
          for f in index.html studio.html sync.html style.css manifest.json sw.js service-worker.js icon-192.png icon-512.png icon-maskable.png; do
            if [[ -f "$f" ]]; then cp "$f" package-web/; fi
          done
          for d in js vendor ejemplos sonidos assets fonts; do
            if [[ -d "$d" ]]; then ditto "$d" "package-web/$d"; fi
          done
          test -s package-web/index.html
          test -s package-web/js/pdf-import.js
          test -s package-web/vendor/vexflow.js
          find package-web/sonidos/piano -name '*.opus' | grep -q .
      - name: Embed private standalone Python service
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --name PentagramaServer \
            --paths . --collect-submodules uvicorn --add-data 'package-web:web' \
            server/desktop_service.py
          ditto dist/PentagramaServer build/Pentagrama.app/Contents/Resources/PentagramaServer
          test -x build/Pentagrama.app/Contents/Resources/PentagramaServer/PentagramaServer
          test -s build/Pentagrama.app/Contents/Resources/PentagramaServer/_internal/web/index.html
      - name: Sign app locally and smoke-test complete conversion service
        shell: bash
        run: |
          set -euo pipefail
          APP="$PWD/build/Pentagrama.app"
          codesign --force --deep --sign - --timestamp=none "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          BIN="$APP/Contents/Resources/Audiveris.app/Contents/MacOS/Audiveris"
          AUDIVERIS_BIN="$BIN" "$APP/Contents/Resources/PentagramaServer/PentagramaServer" > "$RUNNER_TEMP/pentagrama-native-service.log" 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          OK=''
          for i in $(seq 1 90); do
            if curl --fail --silent 'http://127.0.0.1:8787/api/omr/health' > "$RUNNER_TEMP/health.json"; then OK=yes; break; fi
            if ! kill -0 "$PID" 2>/dev/null; then cat "$RUNNER_TEMP/pentagrama-native-service.log"; exit 1; fi
            sleep 0.2
          done
          test "$OK" = yes
          python -c 'import json,os; x=json.load(open(os.environ["RUNNER_TEMP"]+"/health.json")); assert x["available"] is True,x; print("PASS: actual Audiveris recognized by packaged service")'
          curl --fail --silent 'http://127.0.0.1:8787/index.html' | grep -q 'id="stage"'
          curl --fail --silent 'http://127.0.0.1:8787/js/pdf-import.js' | grep -q 'pdfImportGo'
          SAMPLE=$(find package-web/sonidos/piano -name '*.opus' | head -n1)
          curl --fail --silent --output /dev/null "http://127.0.0.1:8787/${SAMPLE#package-web/}"
          STATUS=$(curl --silent --output /dev/null --write-out '%{http_code}' 'http://127.0.0.1:8787/server/omr.py')
          test "$STATUS" = 404
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
          trap - EXIT
          echo 'PASS: editor, PDF endpoint, offline piano samples and private source protection'
      - name: Verify Finder opens native window without Terminal
        shell: bash
        run: |
          set -euo pipefail
          APP="$PWD/build/Pentagrama.app"
          open -n "$APP"
          OK=''
          for i in $(seq 1 100); do
            if curl --fail --silent 'http://127.0.0.1:8787/api/omr/health' > "$RUNNER_TEMP/native-health.json"; then OK=yes; break; fi
            sleep 0.2
          done
          if [[ "$OK" != yes ]]; then echo 'Native application did not start its bundled service'; exit 1; fi
          python -c 'import json,os; x=json.load(open(os.environ["RUNNER_TEMP"]+"/native-health.json")); assert x["available"] is True,x'
          osascript -e 'tell application id "com.morethanmodes.pentagrama" to quit' || true
          echo 'PASS: native .app launched by Finder/open and local recognition available'
      - name: Package drag-to-Applications DMG with source and licenses
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dmg-root/Fuentes
          ditto build/Pentagrama.app dmg-root/Pentagrama.app
          ln -s /Applications dmg-root/Applications
          git archive --format=zip --output=dmg-root/Fuentes/Pentagrama-codigo-fuente.zip HEAD
          curl --fail --location --retry 3 --show-error --silent \
            'https://github.com/Audiveris/audiveris/archive/refs/tags/5.11.0.tar.gz' \
            --output dmg-root/Fuentes/Audiveris-5.11.0-fuente.tar.gz
          curl --fail --location --retry 3 --show-error --silent \
            'https://raw.githubusercontent.com/Audiveris/audiveris/5.11.0/LICENSE' \
            --output dmg-root/Fuentes/Audiveris-LICENCIA.txt
          cat > dmg-root/LEEME.txt <<'GUIDE'
          PENTAGRAMA PARA MAC INTEL - APP NATIVA CON AUDIVERIS INTEGRADO

          Instala: abre el DMG y arrastra Pentagrama.app a Aplicaciones.
          Abre Pentagrama como cualquier aplicacion: sin Terminal, sin Python,
          sin Java por separado, sin navegador externo y sin Internet.
          Pulsa PDF -> Partitura, selecciona un PDF y Convertir y editar.
          Los PDF no salen del Mac. Al cerrar la ventana se cierra el servicio.

          Version x86_64, macOS 12.0 o posterior (no notarizada).
          La primera vez, macOS puede bloquear una aplicacion no notarizada.
          Si confias en el paquete, haz clic derecho en la app -> Abrir,
          y confirma. No desactives Gatekeeper ni SIP.

          Guarda la partitura antes de importar PDF. El reconocimiento optico
          puede equivocarse y la importacion actual puede omitir partes de
          obras multiinstrumentales. Limites: 12 MB, 16 paginas, 3 minutos.
          El editor conserva las partituras en el almacenamiento local de la
          aplicacion. Registro en ~/Library/Logs/Pentagrama/pentagrama.log.

          Audiveris 5.11.0 sin modificar: licencia AGPL-3.0-or-later.
          Codigo fuente y licencia incluidos en la carpeta Fuentes.
          Codigo del editor: https://github.com/delapurap-cmd/pentagrama
          GUIDE
          hdiutil create -volname 'Pentagrama' -srcfolder dmg-root \
            -format UDZO -ov Pentagrama-Mac-Intel.dmg
          hdiutil verify Pentagrama-Mac-Intel.dmg
          test -s Pentagrama-Mac-Intel.dmg
          mkdir -p "$RUNNER_TEMP/verify-pentagrama"
          hdiutil attach -readonly -nobrowse -mountpoint "$RUNNER_TEMP/verify-pentagrama" Pentagrama-Mac-Intel.dmg
          test -x "$RUNNER_TEMP/verify-pentagrama/Pentagrama.app/Contents/MacOS/Pentagrama"
          test -x "$RUNNER_TEMP/verify-pentagrama/Pentagrama.app/Contents/Resources/Audiveris.app/Contents/MacOS/Audiveris"
          test -s "$RUNNER_TEMP/verify-pentagrama/Fuentes/Audiveris-5.11.0-fuente.tar.gz"
          hdiutil detach "$RUNNER_TEMP/verify-pentagrama"
          ls -lh Pentagrama-Mac-Intel.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: Pentagrama-Nativo-Mac-Intel-DMG
          path: Pentagrama-Mac-Intel.dmg
          retention-days: 30
          if-no-files-found: error
