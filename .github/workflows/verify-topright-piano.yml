name: Verify preview corner player and MTM MIDI piano
on:
  push:
    branches:
      - preview/estabilidad-editor-20260920
    paths:
      - js/transport.css
      - .github/workflows/verify-topright-piano.yml
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test browser driver
        run: npm install --no-save playwright-core@1.55.0
      - name: Verify source syntax and no PDF recognition
        run: |
          node --check js/app.js
          node --check js/piano-midi.js
          node --check js/audio.js
          grep -q 'position:fixed;grid-row:auto;grid-column:auto' js/transport.css
          grep -q 'panelPlay:not(.open)' js/transport.css
          ! grep -q 'src="js/pdf-import.js"' index.html
      - name: Browser test compact player and real MIDI chord writing in 3 sizes
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node pruebas/piano-midi-browser.cjs
      - name: Ensure file menu and score editing still work
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          node pruebas/archivo-menu-browser.cjs
          node pruebas/studio-browser.cjs
          node pruebas/toolbar-browser.cjs
