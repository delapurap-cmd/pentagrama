name: Preview player transport - actual navigation and A-B loop
on:
  push:
    branches: [preview/estabilidad-editor-20260920]
    paths: [.github/workflows/preview-player-transport.yml]
permissions:
  contents: write
jobs:
  implement-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser driver
        run: npm install --no-save playwright-core@1.55.0
      - name: Decode reproducible transport patch; reject corrupt content
        run: |
          python3 - <<'PY'
          import base64,lzma,hashlib,pathlib
          src=pathlib.Path('pruebas/transport-patch.xz.b64').read_text().strip()
          code=lzma.decompress(base64.b64decode(src,validate=True))
          assert hashlib.sha256(code).hexdigest()=='4b9bbc884b3579eff6c556dc1ce208de85adb991a8e503a5cb606438189a895c','Patch integrity mismatch'
          pathlib.Path('apply-player.py').write_bytes(code)
          print('Verified player patch:',len(code),'bytes')
          PY
      - name: Apply transport changes to preview branch copy only
        run: |
          python3 apply-player.py
          node --check js/app.js
          node --check js/audio.js
          ! grep -q 'src="js/pdf-import.js"' index.html
          test -s js/transport.css
          git diff --check
          git diff --stat
      - name: Test actual controls, measure seeks, metronome and A-B loop in Chromium
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node pruebas/transport-browser.cjs
      - name: Preserve MIDI MusicXML and original editor regressions
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          node pruebas/archivo-menu-browser.cjs
          node pruebas/preview-roundtrip.cjs
          node pruebas/studio-browser.cjs
          node pruebas/sync-inline-browser.cjs
          node pruebas/toolbar-browser.cjs
      - name: Commit verified implementation to PREVIEW ONLY
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html js/app.js js/audio.js js/transport.css
          git diff --cached --quiet && exit 1
          git commit -m 'Add persistent transport, bar navigation, metronome and editable A-B loop'
          git push origin HEAD:preview/estabilidad-editor-20260920
      - name: Create complete web preview without deploying Pages
        run: |
          mkdir -p preview
          cp index.html studio.html sync.html style.css manifest.json icon-192.png icon-512.png icon-maskable.png preview/
          cp -R js vendor sonidos ejemplos preview/
          printf '%s\n' 'PENTAGRAMA WEB: prueba local, no publicada en More Than Modes ni GitHub Pages.' 'El reproductor se ve abajo con inicio, anterior, siguiente, metronomo, bucle A-B.' 'Para vista local: python3 -m http.server 8000 y abrir http://localhost:8000/studio.html.' > preview/LEEME.txt
          cd preview && zip -qr ../Pentagrama-Web-Transporte.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: Pentagrama-Web-Transporte-Probado
          path: Pentagrama-Web-Transporte.zip
          retention-days: 14
