<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reper — Editor de partituras</title>
<meta name="description" content="Editor de partituras en clave de sol: escribe notas tocando el pentagrama, con relleno automático de silencios, armaduras y escritura de tiempos por tap.">
<meta name="theme-color" content="#0b0b0c">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="js/toolbar-compact.css">
<link rel="stylesheet" href="js/sync-inline.css">
<link rel="stylesheet" href="js/workspace-sides.css">
<link rel="stylesheet" href="js/workspace-header.css">
<link rel="stylesheet" href="js/transport.css">
<link rel="stylesheet" href="js/piano-midi.css">
<link rel="stylesheet" href="js/editor-reorg.css">
<link rel="stylesheet" href="js/instrument-panel-compact.css">
<link rel="stylesheet" href="js/catalogo.css">
<link rel="stylesheet" href="js/product-navigation.css">
<link rel="stylesheet" href="js/compact-workspace.css">
</head>
<body>

<header class="bar">
  <a class="btn ghost icon back standalone-only" href="https://morethanmodes.com" title="More Than Modes" aria-label="More Than Modes">←</a>
  <button class="btn ghost icon embed-only" id="btnEmbedClose" title="Volver al cuaderno">←</button>
  <button class="btn embed-only" id="btnTools">♫ Herramientas</button>
  <button class="btn standalone-only" id="btnSideTools" type="button" aria-controls="editorRail" aria-expanded="false" aria-label="Herramientas de partitura" title="Mostrar u ocultar herramientas de partitura">♫</button>
  <button class="btn section-tab" id="btnFile" type="button" aria-haspopup="menu">Archivo</button>
  <button class="btn section-tab catalog-entry" id="btnCatalogo" type="button" aria-haspopup="dialog" title="Buscar y abrir partituras del catálogo">▤ Catálogo</button>
  <button class="btn section-tab" id="btnEdit" type="button" aria-haspopup="menu">Edición</button>
  <span class="header-separator standalone-only" aria-hidden="true"></span>
  <button class="btn section-tab" id="btnTab" type="button" aria-pressed="false" title="Mostrar tablatura vinculada al pentagrama" aria-label="Mostrar u ocultar tablatura">TAB</button>
  <button class="btn section-tab" id="btnPiano" type="button" aria-controls="instrumentMenu" aria-expanded="false" aria-haspopup="true" title="Elegir instrumento y ajustar su sonido">♬ Instrumentos ▾</button>
  <section class="instrument-menu" id="instrumentMenu" aria-label="Elegir instrumento" hidden>
    <div class="instrument-menu-title">Instrumento en el lienzo</div>
    <div class="device-controls" role="group" aria-label="Instrumento y sonido">
      <div class="instrument-choice">
        <label class="device-field" for="deviceSelect"><span>Instrumentos disponibles</span><select id="deviceSelect" aria-label="Elegir instrumento visual"></select></label>
        <button class="btn primary" id="deviceShow" type="button">Mostrar</button>
      </div>
      <label class="device-field" for="soundSelect"><span>Sonido</span><select id="soundSelect" aria-label="Seleccionar timbre de reproducción"></select></label>
    </div>
    <details class="device-fold" id="deviceNotation">
      <summary>Transposición <span id="deviceCurrent">Do · sonido real</span></summary>
      <div class="device-fold-body">
        <label for="deviceWritten">Escritura para</label>
        <select id="deviceWritten" aria-label="Elegir instrumento transpositor"></select>
        <button class="btn" type="button" id="deviceApply" title="Reescribir notas, armadura y claves conservando la altura sonora">Aplicar transposición</button>
        <p id="deviceInfo" class="device-info">Conserva el sonido al convertir.</p>
      </div>
    </details>
    <details class="device-fold" id="deviceTab">
      <summary>Tablatura <span id="tabActiveLabel">Oculta</span></summary>
      <fieldset class="tab-device-controls" id="tabDeviceControls" aria-label="Configuración de tablatura vinculada">
        <label class="tab-check"><input type="checkbox" id="tabEnabled"> Mostrar tablatura</label>
        <div class="tab-fields">
          <label for="tabPreset">Afinación<select id="tabPreset" aria-label="Afinación de la tablatura"></select></label>
          <label for="tabStaff">Pentagrama<select id="tabStaff" aria-label="Pentagrama fuente de la tablatura"></select></label>
          <label for="tabCapo">Capo<input id="tabCapo" type="number" min="0" max="12" step="1" value="0" aria-label="Capotraste"></label>
        </div>
      </fieldset>
    </details>
  </section>
  <button class="btn audio-sync-link" id="btnAudioSync" type="button" aria-expanded="false" aria-controls="syncDock" title="Desplegar Audio Sync sobre esta partitura">◉ Audio Sync</button>
  <div class="bar-tools" id="barTools">
    <button class="btn" id="btnNew" title="Añadir sistema, página o ajustar plantilla" aria-label="Añadir sistema, página o ajustar plantilla">＋</button>
    <span class="tool-label standalone-only" aria-hidden="true">Partitura</span>
    <button class="btn" id="btnClef" title="Clave"><span class="lab">Clave</span> <span class="chip" id="chipClef">Sol</span></button>
    <button class="btn" id="btnKey" title="Armadura"><span class="lab">Armadura</span> <span class="chip" id="chipKey">Do M</span></button>
    <button class="btn" id="btnTime" title="Compás"><span class="lab">Compás</span> <span class="chip" id="chipTime">4/4</span></button>
    <span class="br"></span>
    <span class="tool-label standalone-only" aria-hidden="true">Vista</span>
    <div class="zoom">
      <button class="btn ghost icon" id="btnZoomOut" title="Reducir">−</button>
      <span class="chip" id="chipZoom">100%</span>
      <button class="btn ghost icon" id="btnZoomIn" title="Ampliar">+</button>
      <button class="btn ghost icon" id="btnZoomFit" title="Ajustar la hoja a la pantalla" aria-label="Ajustar la hoja a la pantalla">⤢</button>
    </div>
    <span class="tool-label standalone-only" aria-hidden="true">Historial</span>
    <button class="btn ghost icon" id="btnUndo" title="Deshacer (Ctrl+Z)">↺</button>
    <button class="btn ghost icon" id="btnRedo" title="Rehacer">↻</button>
    <button class="btn ghost icon" id="btnPrint" title="Imprimir o PDF">⎙</button>

  </div>
  <span class="sp"></span>
  <button class="btn icon primary" id="btnQuickPlay" type="button" aria-label="Reproducir" title="Reproducir"><svg class="transport-icon" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true" focusable="false"><path d="m8 5 11 7-11 7V5Z" fill="currentColor" stroke="none"/></svg></button>
  <button class="btn" id="btnPlay" type="button" aria-controls="panelPlay" aria-expanded="false" title="Controles de reproducción"><svg class="transport-icon" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 5v14M9 5v14M14 5l7 7-7 7V5Z"/></svg> Controles</button>
<!-- Reproductor -->
<section class="panel play open" id="panelPlay" aria-label="Reproductor de partitura" aria-hidden="false">
  <div class="transport-main row" role="group" aria-label="Transporte musical">
    <button class="btn ghost icon" id="ppStop" type="button" aria-label="Ir al inicio" title="Ir al inicio"><svg class="transport-icon" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 5v14M12 12l8-6v12l-8-6ZM5 12l7-6v12l-7-6Z"/></svg></button>
    <button class="btn ghost icon" id="ppPrev" type="button" aria-label="Compás anterior" title="Compás anterior"><svg class="transport-icon" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 5v14M19 5 7 12l12 7V5Z"/></svg></button>
    <button class="btn icon primary" id="ppPlay" type="button" aria-label="Reproducir" title="Reproducir / pausar"><svg class="transport-icon" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m8 5 11 7-11 7V5Z" fill="currentColor" stroke="none"/></svg></button>
    <button class="btn ghost icon" id="ppNext" type="button" aria-label="Compás siguiente" title="Compás siguiente"><svg class="transport-icon" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M19 5v14M5 5l12 7-12 7V5Z"/></svg></button>
  <div class="tempo-cluster" role="group" aria-label="Tempo y metrónomo">
    <button class="btn metro-always" id="btnMetroAlways" type="button" aria-pressed="false" title="Armar metrónomo; suena solo con Play" aria-label="Armar metrónomo"><svg class="metro-icon" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M8 5h8l4 16H4L8 5ZM12 17l5-14M8 17h8"/><circle cx="17" cy="3" r="1.3" fill="currentColor" stroke="none"/></svg><span id="metroIndicator" aria-hidden="true"></span></button>
    <output id="metroTempo" class="tempo-readout" aria-label="Tempo de partitura en pulsaciones por minuto">90 BPM</output>
    <button class="btn tempo-chevron" id="btnTempoMenu" type="button" aria-expanded="false" aria-controls="panel" aria-label="Ajustar tempo y escribir ritmo mediante Tap" title="Tempo y Tap"><svg class="tiny-chevron" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m6 9 6 6 6-6"/></svg></button>
    <button class="btn count-always" id="btnCountAlways" type="button" aria-pressed="false" title="Activar precuenta de un compás" aria-label="Armar precuenta de un compás"><svg class="transport-icon" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8.5"/><path d="M12 6v6l4 2M12 2v2M20 12h2"/></svg></button>
  </div>
    <output class="transport-pos" id="ppPos" aria-live="off">Compás 1 / 1</output>
    <button class="btn transport-toggle" id="ppMetro" type="button" aria-pressed="false" title="Metrónomo durante la reproducción"><svg class="transport-icon" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M8 5h8l4 16H4L8 5ZM12 17l5-14M8 17h8"/><circle cx="17" cy="3" r="1.3" fill="currentColor" stroke="none"/></svg> Metrónomo</button>
    <button class="btn transport-toggle" id="ppBucle" type="button" aria-pressed="false" title="Repetir los compases A–B"><svg class="transport-icon" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M18 7H8a5 5 0 0 0-5 5v1M15 4l3 3-3 3M6 17h10a5 5 0 0 0 5-5v-1M9 14l-3 3 3 3"/></svg> Bucle A–B</button>
    <button class="btn ghost" id="ppRangeButton" type="button" aria-controls="ppLoopControls" aria-expanded="false">A–B <svg class="tiny-chevron" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m6 9 6 6 6-6"/></svg></button>
    <button class="btn ghost icon" id="ppClose" type="button" title="Cerrar reproductor" aria-label="Cerrar reproductor"><svg class="transport-icon" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M5 5l14 14M19 5 5 19"/></svg></button>
  </div>
  <div class="transport-timeline">
    <input class="barra" id="ppBarra" type="range" min="0" max="1000" value="0" step="1" aria-label="Desplazar reproducción por la partitura">
    <div class="transport-loop" id="ppLoopControls" role="group" hidden aria-label="Seleccionar compases para bucle">
      <label for="ppAInput">Desde A</label>
      <input id="ppAInput" type="number" inputmode="numeric" min="1" step="1" value="1" aria-label="Compás inicial A">
      <button class="btn ghost" id="ppSetA" type="button" title="Usar el compás actual como A">Marcar A</button>
      <span class="transport-arrow" aria-hidden="true">→</span>
      <label for="ppBInput">Hasta B</label>
      <input id="ppBInput" type="number" inputmode="numeric" min="1" step="1" value="1" aria-label="Compás final B">
      <button class="btn ghost" id="ppSetB" type="button" title="Usar el compás actual como B">Marcar B</button>
      <output id="ppRegion" aria-live="off">1 compás</output>
      <button class="btn ghost" id="ppSaveLoop" type="button" title="Guardar esta región A–B">Guardar bucle</button>
      <select id="ppLoops" aria-label="Bucles guardados"><option value="">Bucles guardados…</option></select>
      <button class="btn ghost" id="ppDeleteLoop" type="button" title="Eliminar el bucle seleccionado" disabled>Eliminar</button>
    </div>
  </div>
</section>

</header>

<!-- El lateral contiene los botones reales; no es una réplica del editor. -->
<aside class="editor-rail standalone-only" id="editorRail" aria-label="Herramientas de partitura"></aside>
<main class="stage" id="scroller">
  <div class="sheets" id="stage"></div>
</main>

<!-- Instrumento visual al pie del lienzo; selección y ajustes en el desplegable. -->
<section class="ayuda-dock" id="panelAyuda" aria-label="Instrumentos" hidden>
  <div class="piano-device-head"><strong id="pianoDeviceTitle">Instrumentos</strong>
    <button class="btn ghost icon" id="btnPianoClose" type="button" aria-label="Cerrar instrumentos" title="Cerrar instrumentos"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 5l14 14M19 5 5 19"/></svg></button>
  </div>
  <div class="ins-caja" id="insCaja"></div>
  <p class="ins-aviso" id="insAviso" role="status"></p>
</section>

<!-- Panel de escritura de tiempos -->
<section class="panel" id="panel" aria-label="Escribir tiempos">
  <div class="row">
    <div class="bpm-step">
      <button class="btn ghost icon" id="bpmDown" title="Bajar el tempo" aria-label="Bajar el tempo">−</button>
      <output class="num" id="bpm" title="Tempo">90</output>
      <button class="btn ghost icon" id="bpmUp" title="Subir el tempo" aria-label="Subir el tempo">＋</button>
    </div>
    <label class="lbl" for="ppCount">Precuenta</label><select class="sel" id="ppCount" aria-label="Duración de precuenta"><option value="0">Desactivada</option><option value="1">1 compás</option><option value="2">2 compases</option></select>
    <button class="btn ghost icon" id="btnPanelClose" title="Cerrar">✕</button>
  </div>

  <button class="tap" id="btnTapPad" type="button" title="Marcar figuras con el ratón al tempo único de la partitura">Tap · marcar ritmo</button>

  <div class="preview" id="tapPreview"></div>

  <div class="actions">
    <span class="tap-info" id="tapInfo"></span>
    <button class="btn" id="btnTapClear">Borrar</button>
    <button class="btn primary" id="btnTapOk" disabled>Escribir</button>
  </div>
</section>

<div class="toast" id="toast"></div>

<script>
window.structuredClone=window.structuredClone||function(v){return JSON.parse(JSON.stringify(v))};
Promise.allSettled=Promise.allSettled||function(items){return Promise.all(Array.from(items,p=>Promise.resolve(p).then(
  value=>({status:'fulfilled',value}),reason=>({status:'rejected',reason}))));};
if(!Array.prototype.at)Array.prototype.at=function(i){i=Math.trunc(i)||0;if(i<0)i+=this.length;return this[i]};
</script>
<script src="vendor/vexflow.js"></script>
<script src="js/native.js"></script>
<script src="js/model.js"></script>
<script src="js/musicxml.js"></script>
<script src="js/midi.js"></script>
<script src="js/engrave.js"></script>
<script src="js/radial.js"></script>
<script src="js/audio.js"></script>
<script src="js/score-instruments.js"></script>
<script src="js/tablature.js"></script>
<script src="js/range-edit.js"></script>
<script src="js/practice-core.js"></script>
<script src="js/piano-midi.js"></script>
<script src="js/instrumentos.js"></script>
<script src="js/catalogo.js"></script>
<script src="js/app.js"></script>
<script src="js/sync-core.js"></script>
<script src="js/sync-inline.js"></script>
<script src="js/workspace-sides.js"></script>
</body>
</html>
