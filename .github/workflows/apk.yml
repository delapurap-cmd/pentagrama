name: APK Android (Reper)

# Construye el APK del editor de partituras.
# Ejecútalo desde la pestaña Actions → "Run workflow"; el APK queda
# como artefacto descargable al final de la ejecución.
on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'style.css'
      - 'js/**'
      - 'vendor/**'
      - 'mobile/**'
      - '.github/workflows/apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        working-directory: mobile
        run: npm ci

      - name: Preparar la web y sincronizar Android
        working-directory: mobile
        run: |
          node build-www.mjs
          npx cap sync android

      - name: Compilar APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publicar el APK
        uses: actions/upload-artifact@v4
        with:
          name: mtm-escritura-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
