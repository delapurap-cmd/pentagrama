name: APK Android (Reper)

# Construye el APK del editor de partituras. Además del artefacto —que sólo
# se baja con sesión iniciada— deja una publicación con un enlace fijo que
# siempre apunta al último APK compilado.
on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'style.css'
      - 'js/**'
      - 'vendor/**'
      - 'mobile/**'
      - '.github/workflows/apk.yml'

permissions:
  contents: write

# una compilación a la vez: si empieza otra, la anterior se cancela
concurrency:
  group: reper-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        working-directory: mobile
        run: npm ci

      - name: Preparar la web y sincronizar Android
        working-directory: mobile
        run: |
          node build-www.mjs
          npx cap sync android

      - name: Compilar APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          # sin consola interactiva: cualquier pregunta falla en vez de colgarse
          ./gradlew assembleDebug --no-daemon --console=plain < /dev/null

      - name: Publicar el APK
        uses: actions/upload-artifact@v4
        with:
          name: mtm-escritura-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Dejar el APK descargable por enlace
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk mtm-escritura.apk
          gh release delete escritura-latest --yes --cleanup-tag || true
          gh release create escritura-latest mtm-escritura.apk \
            --title "MTM Escritura (último APK)" \
            --notes "APK del commit ${{ github.sha }}, rama ${{ github.ref_name }}."
