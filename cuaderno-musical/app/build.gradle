plugins { id 'com.android.application' }

android {
    namespace 'com.camiloperdomo.cuadernomusical'
    compileSdk 35
    defaultConfig {
        applicationId 'com.camiloperdomo.cuadernomusical'
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName '1.8.0'
        ndk { abiFilters 'arm64-v8a' }
    }
    // La clave de firma no vive en el repositorio: se coge de app/reper-release.jks
    // si está presente (compilación local) o de las variables REPER_KEYSTORE* que
    // el flujo de Actions rellena desde los secretos. Sin ella se firma en modo
    // depuración, que sirve para probar pero no para actualizar la app instalada.
    def keystoreFile = file(System.getenv('REPER_KEYSTORE_FILE') ?: 'reper-release.jks')
    def keystorePass = System.getenv('REPER_KEYSTORE_PASSWORD') ?: 'reper-local-2026'
    def keystoreAlias = System.getenv('REPER_KEY_ALIAS') ?: 'reper'
    def signed = keystoreFile.exists()

    if (signed) {
        signingConfigs {
            reper {
                storeFile keystoreFile
                storePassword keystorePass
                keyAlias keystoreAlias
                keyPassword System.getenv('REPER_KEY_PASSWORD') ?: keystorePass
            }
        }
    }
    buildTypes {
        debug { if (signed) signingConfig signingConfigs.reper }
        release {
            if (signed) signingConfig signingConfigs.reper
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core:1.15.0'
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
}

configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
