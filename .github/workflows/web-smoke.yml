name: Pentagrama Studio browser tests
on:
  push:
    branches: [main]
    paths:
      - 'studio.html'
      - 'sync.html'
      - 'index.html'
      - 'js/**'
      - 'style.css'
      - 'pruebas/studio-browser.cjs'
      - 'pruebas/sync-inline-browser.cjs'
      - 'pruebas/toolbar-browser.cjs'
      - 'pruebas/preview-diagnose.cjs'
      - 'pruebas/preview-validate.cjs'
      - '.github/workflows/web-smoke.yml'
  pull_request:
    paths:
      - 'studio.html'
      - 'sync.html'
      - 'index.html'
      - 'js/**'
      - 'style.css'
      - 'pruebas/studio-browser.cjs'
      - 'pruebas/sync-inline-browser.cjs'
      - 'pruebas/toolbar-browser.cjs'
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install lightweight browser driver
        run: npm install --no-save playwright-core@1.55.0
      - name: Verify editor remains intact and PDF recognition is not loaded
        run: |
          node --check js/radial.js
          node --check js/sync-core.js
          node --check js/sync-inline.js
          node --check js/workspace-sides.js
          node --check pruebas/toolbar-browser.cjs
          node --check pruebas/studio-browser.cjs
          node --check pruebas/sync-inline-browser.cjs
          node --check js/sync-studio.js
          node --check pruebas/preview-validate.cjs
          test -s studio.html
          test -s js/sync-inline.css
          test -s js/workspace-sides.css
          test -s js/workspace-header.css
          test -s js/toolbar-compact.css
          test -s vendor/vexflow.js
          grep -q 'src="js/musicxml.js"' index.html
          grep -q 'src="js/midi.js"' index.html
          grep -q 'src="js/app.js"' index.html
          grep -q 'src="js/audio.js"' index.html
          ! grep -q 'src="js/pdf-import.js"' index.html
          ! grep -q 'href="js/pdf-import.css"' index.html
      - name: Test real application locally in Chrome
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node pruebas/studio-browser.cjs
      - name: Test actual note selection, sync markers and A-B loops
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node pruebas/sync-inline-browser.cjs
      - name: Test general top bar and editing commands in Chrome
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node pruebas/toolbar-browser.cjs
      - name: Diagnose optional external preview
        continue-on-error: true
        run: node pruebas/preview-diagnose.cjs
      - name: Test public preview after one-time confirmation
        continue-on-error: true
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node pruebas/preview-validate.cjs
