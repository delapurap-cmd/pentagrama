name: Test distributed Mac DMG with real three-page PDF and Audiveris
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-built-mac-dmg-real-pdf.yml'
      - 'pruebas/omr-real-browser.cjs'
permissions:
  actions: read
  contents: read
jobs:
  test-distributed-dmg:
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download ACTUAL new DMG built with multi-page piano fixes
        uses: actions/download-artifact@v4
        with:
          name: Pentagrama-Nativo-Mac-Intel-DMG
          run-id: 35483360924
          repository: delapurap-cmd/pentagrama
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: downloaded
      - name: Mount DMG, verify installed app and copy to Applications-style location
        shell: bash
        run: |
          set -euo pipefail
          test -s downloaded/Pentagrama-Mac-Intel.dmg
          hdiutil verify downloaded/Pentagrama-Mac-Intel.dmg
          mkdir -p "$RUNNER_TEMP/mounted" "$RUNNER_TEMP/install"
          hdiutil attach -readonly -nobrowse -mountpoint "$RUNNER_TEMP/mounted" downloaded/Pentagrama-Mac-Intel.dmg
          ditto "$RUNNER_TEMP/mounted/Pentagrama.app" "$RUNNER_TEMP/install/Pentagrama.app"
          hdiutil detach "$RUNNER_TEMP/mounted"
          APP="$RUNNER_TEMP/install/Pentagrama.app"
          test -x "$APP/Contents/MacOS/Pentagrama"
          test -x "$APP/Contents/Resources/PentagramaServer/PentagramaServer"
          test -x "$APP/Contents/Resources/Audiveris.app/Contents/MacOS/Audiveris"
          find "$APP/Contents/Resources" -name pdf-parts.js -print -quit | grep -q pdf-parts.js
          codesign --verify --deep --verbose=2 "$APP"
          echo 'PASS: actual DMG verified and mounted; native app, private offline server, Audiveris and piano part selection bundled'
      - name: Obtain authentic continuous three-page Chopin score from public Mutopia edition
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'pypdf>=5,<7'
          # Chopin Op. 9 no. 2, Mutopia 1590, edition CC BY-SA 3.0.
          curl -fLsS --retry 3 'https://www.mutopiaproject.org/ftp/ChopinFF/O9/chopin_nocturne_op9_n2/chopin_nocturne_op9_n2-a4.pdf' -o "$RUNNER_TEMP/real3.pdf"
          python - <<'PY'
          import os
          from pathlib import Path
          from pypdf import PdfReader
          target=Path(os.environ['RUNNER_TEMP'])/'real3.pdf'
          pages=PdfReader(target, strict=True).pages
          assert len(pages)==3,f'Expected continuous three-page Chopin Nocturne PDF, got {len(pages)}'
          print('PASS: genuine continuous three-page Chopin Nocturne PDF,',target.stat().st_size,'bytes')
          PY
      - name: Launch actual installed GUI app without Terminal and check bundled service
        shell: bash
        run: |
          set -euo pipefail
          open -n "$RUNNER_TEMP/install/Pentagrama.app"
          for i in $(seq 1 120); do
            if curl -fsS 'http://127.0.0.1:8787/api/omr/health' > "$RUNNER_TEMP/health.json" 2>/dev/null; then break; fi
            sleep 0.25
          done
          python - <<'PY'
          import json,os
          health=json.load(open(os.environ['RUNNER_TEMP']+'/health.json'))
          assert health['available'] is True and health['background_jobs'] is True,health
          print('PASS: native DMG app launches its own bundled offline recognition engine')
          PY
      - name: REAL 3-PAGE CHOPIN through the ACTUAL packaged local engine
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -F "pdf=@$RUNNER_TEMP/real3.pdf" 'http://127.0.0.1:8787/api/omr/jobs' > "$RUNNER_TEMP/job.json"
          python - <<'PY'
          import os,json,time,urllib.request,xml.etree.ElementTree as ET
          base='http://127.0.0.1:8787/api/omr/jobs/'
          identifier=json.load(open(os.environ['RUNNER_TEMP']+'/job.json'))['job_id']
          deadline=time.monotonic()+615
          while time.monotonic()<deadline:
              with urllib.request.urlopen(base+identifier,timeout=6) as r: status=json.load(r)
              if status['status']=='error': raise AssertionError(status)
              if status['status']=='done': break
              assert status['status'] in ('running','queued'),status
              time.sleep(1)
          else: raise AssertionError('Three-page recognition in actual DMG never completed')
          with urllib.request.urlopen(base+identifier+'/result',timeout=8) as r: xml=r.read()
          root=ET.fromstring(xml)
          assert root.tag=='score-partwise',root.tag
          noteheads=len(root.findall('.//note/pitch'))
          assert noteheads>100,noteheads
          measures=sum(len(part.findall('measure')) for part in root.findall('part'))
          assert measures>12,measures
          print('PASS: ACTUAL DMG converted a REAL THREE-PAGE CHOPIN:',noteheads,'pitched noteheads,',measures,'source measures')
          PY
      - name: REAL editor UI imports second authentic three-page Chopin PDF and renders editable notes
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright-core@1.57.0
          OMR_REAL_HOST='http://127.0.0.1:8787' \
          OMR_REAL_PDF="$RUNNER_TEMP/real3.pdf" \
          CHROME_BIN='/Applications/Google Chrome.app/Contents/MacOS/Google Chrome' \
            node pruebas/omr-real-browser.cjs
      - name: Print local diagnostic log on failure
        if: failure()
        run: tail -150 "$HOME/Library/Logs/Pentagrama/pentagrama.log" 2>/dev/null || true
