name: PDF OMR service tests
on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/omr-tests.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/omr-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install server dependencies
        run: pip install -r server/requirements.txt
      - name: Verify syntax
        run: python -m compileall -q server
      - name: Test PDF checks and Audiveris worker contract
        run: python -m unittest discover -s server/tests -v
