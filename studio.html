<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0c">
  <title>Pentagrama</title>
  <link rel="icon" href="icon-192.png">
  <script>
    /* La entrada web sólo redirige al editor; Audio Sync vive en esa misma hoja. */
    (() => {
      const sync = location.hash.toLowerCase() === '#sync';
      const params = new URLSearchParams(location.search);
      if (sync) params.set('sync','1');
      location.replace('index.html' + (params.size ? '?' + params.toString() : ''));
    })();
  </script>
  <noscript><meta http-equiv="refresh" content="0;url=index.html"></noscript>
</head>
<body><a href="index.html">Abrir Pentagrama</a></body>
</html>
