name: APK Cuaderno Musical

# Compila la app del cuaderno. Con los secretos REPER_KEYSTORE_B64 y
# REPER_KEYSTORE_PASSWORD el APK sale firmado con la clave de siempre y se
# instala encima del que ya tengas; sin ellos sale firmado en modo depuración
# (hay que desinstalar la versión anterior antes de instalarlo).
on:
  workflow_dispatch:
  push:
    branches: [ cuaderno ]
    paths:
      - 'cuaderno-musical/**'
      - '.github/workflows/cuaderno-apk.yml'

permissions:
  contents: write

# una compilacion a la vez: si empieza otra, la anterior se cancela
concurrency:
  group: cuaderno-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Recuperar la clave de firma
        env:
          KEYSTORE_B64: ${{ secrets.REPER_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.REPER_KEYSTORE_PASSWORD }}
        run: |
          # sin contrasena, gradle la pediria por consola y el flujo se quedaria colgado
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > cuaderno-musical/app/reper-release.jks
            echo "firmado=si" >> "$GITHUB_ENV"
          else
            echo "Sin clave: el APK saldrá firmado en modo depuración."
            echo "firmado=no" >> "$GITHUB_ENV"
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar
        working-directory: cuaderno-musical
        env:
          REPER_KEYSTORE_PASSWORD: ${{ secrets.REPER_KEYSTORE_PASSWORD }}
          REPER_KEY_PASSWORD: ${{ secrets.REPER_KEY_PASSWORD }}
          REPER_KEY_ALIAS: ${{ secrets.REPER_KEY_ALIAS }}
        run: |
          tarea=assembleDebug
          if [ "$firmado" = "si" ]; then tarea=assembleRelease; fi
          # sin consola interactiva: cualquier pregunta falla en vez de colgarse
          timeout 45m gradle "$tarea" --no-daemon --console=plain --stacktrace < /dev/null

      - name: Publicar el APK
        uses: actions/upload-artifact@v4
        with:
          name: Cuaderno-Musical-APK
          path: cuaderno-musical/app/build/outputs/apk/*/*.apk
          if-no-files-found: error

      - name: Dejar el APK descargable por enlace
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # un único enlace fijo que siempre apunta al último APK
          apk=$(find cuaderno-musical/app/build/outputs/apk -name '*.apk' | head -1)
          cp "$apk" cuaderno-musical.apk
          gh release delete cuaderno-latest --yes --cleanup-tag || true
          gh release create cuaderno-latest cuaderno-musical.apk \
            --title "Cuaderno Musical (último APK)" \
            --notes "APK del commit ${{ github.sha }} (firma: $firmado)."
