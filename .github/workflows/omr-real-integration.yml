name: Real Audiveris PDF conversion integration
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/omr-real-integration.yml'
      - 'server/**'
      - 'js/pdf-import.js'
      - 'pruebas/omr-real-browser.cjs'
jobs:
  convert-real-pdf:
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependencies and worker unit tests
        run: |
          python -m pip install -r server/requirements.txt
          python -m unittest discover -s server/tests -v
          npm install --no-save --no-package-lock playwright-core@1.57.0
      - name: Download a real PDF from the official Audiveris example set
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 https://raw.githubusercontent.com/Audiveris/audiveris/master/data/examples/SchbAvMaSample.pdf -o "$RUNNER_TEMP/official-example.pdf"
          python - <<'PY'
          import os
          from server.omr import check_pdf
          data=open(os.environ['RUNNER_TEMP']+'/official-example.pdf','rb').read()
          print('PASS: real PDF pages:',check_pdf(data),'bytes:',len(data))
          PY
      - name: Install real Mac Intel Audiveris and inspect CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 https://github.com/Audiveris/audiveris/releases/download/5.11.0/Audiveris-5.11.0-macosx-x86_64.dmg -o "$RUNNER_TEMP/Audiveris.dmg"
          mkdir -p "$RUNNER_TEMP/audiveris-volume" "$RUNNER_TEMP/omrout"
          printf 'y\n' | PAGER=cat hdiutil attach -readonly -nobrowse -mountpoint "$RUNNER_TEMP/audiveris-volume" "$RUNNER_TEMP/Audiveris.dmg" >/dev/null
          BIN=$(find "$RUNNER_TEMP/audiveris-volume" -type f -path '*/Audiveris.app/Contents/MacOS/Audiveris' -print -quit)
          test -x "$BIN"
          echo "AUDIVERIS_BIN=$BIN" >> "$GITHUB_ENV"
          "$BIN" -help 2>&1 | grep -E 'transcribe|export|batch|output'
      - name: REAL direct Audiveris PDF to MusicXML
        shell: bash
        run: |
          set -uo pipefail
          "$AUDIVERIS_BIN" -batch -transcribe -export -output "$RUNNER_TEMP/omrout" "$RUNNER_TEMP/official-example.pdf" > "$RUNNER_TEMP/audiveris-real.log" 2>&1
          code=$?
          tail -30 "$RUNNER_TEMP/audiveris-real.log"
          test "$code" = 0 || exit "$code"
          FILE=$(find "$RUNNER_TEMP/omrout" -type f \( -iname '*.mxl' -o -iname '*.musicxml' -o -iname '*.xml' \) | head -1)
          test -s "$FILE" || { echo 'FAIL: Audiveris did not export MusicXML'; exit 1; }
          echo 'PASS: actual Audiveris PDF -> MusicXML'
      - name: REAL worker converts compressed Audiveris MXL to plain editable XML
        shell: bash
        run: |
          python - <<'PY'
          import os, time
          from xml.etree import ElementTree as ET
          from server.omr import convert_pdf
          sample=open(os.environ['RUNNER_TEMP']+'/official-example.pdf','rb').read()
          start=time.monotonic()
          xml, extension=convert_pdf(sample)
          assert extension=='.musicxml',extension
          root=ET.fromstring(xml)
          assert root.tag=='score-partwise',root.tag
          notes=len(root.findall('.//note'))
          assert notes>0, 'recognized file has no editable note elements'
          print('PASS: real worker returns uncompressed MusicXML,',notes,'notes,',len(xml),'bytes, seconds',round(time.monotonic()-start,1))
          PY
      - name: REAL short-request HTTP background recognition and XML result
        shell: bash
        run: |
          set -euo pipefail
          python -m uvicorn server.app:app --host 127.0.0.1 --port 18787 --log-level warning > "$RUNNER_TEMP/omr-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/omr-api.pid"
          for i in $(seq 1 60); do
            if curl -fsS 'http://127.0.0.1:18787/api/omr/health' > "$RUNNER_TEMP/health.json" 2>/dev/null; then break; fi
            sleep 0.2
          done
          python - <<'PY'
          import json,os
          h=json.load(open(os.environ['RUNNER_TEMP']+'/health.json'))
          assert h['available'] and h['background_jobs'],h
          print('PASS: real Audiveris health with background job support')
          PY
          curl -fsS -F "pdf=@$RUNNER_TEMP/official-example.pdf" 'http://127.0.0.1:18787/api/omr/jobs' > "$RUNNER_TEMP/job.json"
          python - <<'PY'
          import json,os,time,urllib.request,xml.etree.ElementTree as ET
          base='http://127.0.0.1:18787/api/omr/jobs/'
          job_id=json.load(open(os.environ['RUNNER_TEMP']+'/job.json'))['job_id']
          for _ in range(180):
              with urllib.request.urlopen(base+job_id,timeout=4) as r: status=json.load(r)
              if status['status']=='error': raise AssertionError('REAL OMR job failed: '+str(status))
              if status['status']=='done': break
              assert status['status'] in ('queued','running'),status
              time.sleep(1)
          else: raise AssertionError('OMR HTTP job never completed')
          with urllib.request.urlopen(base+job_id+'/result',timeout=10) as r:
              assert r.status==200,r.status
              xml=r.read()
          root=ET.fromstring(xml)
          assert root.tag=='score-partwise'
          notes=len(root.findall('.//note'))
          assert notes>0,notes
          print('PASS: actual POST -> queued/running -> finished -> GET plain MusicXML:',notes,'notes')
          PY
      - name: REAL browser imports the actual PDF and renders editable score
        shell: bash
        env:
          CHROME_BIN: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
        run: |
          set -euo pipefail
          test -x "$CHROME_BIN"
          OMR_REAL_PDF="$RUNNER_TEMP/official-example.pdf" OMR_REAL_HOST='http://127.0.0.1:18787' node pruebas/omr-real-browser.cjs
      - name: Print actual server diagnostics on failure
        if: failure()
        run: |
          echo '---- Local server log ----'
          tail -120 "$RUNNER_TEMP/omr-api.log" 2>/dev/null || true
          echo '---- Official Audiveris recognition log ----'
          tail -70 "$RUNNER_TEMP/audiveris-real.log" 2>/dev/null || true
